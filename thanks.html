<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ご回答ありがとうございました</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:radial-gradient(circle at 50% 0%, #24357f 0%, #0a1440 70%);
    font-family:'Noto Serif JP', serif;
    color:#fbf6e9;
  }
  .card{
    max-width:420px;
    width:100%;
    text-align:center;
    border:3px solid #d9b25c;
    border-radius:18px;
    padding:40px 24px;
    background:linear-gradient(180deg, #22348c 0%, #0d1a4b 100%);
    box-shadow:0 0 0 6px rgba(217,178,92,0.15), 0 10px 30px rgba(0,0,0,0.35);
  }
  .logo-name{
    font-family:'Great Vibes', cursive;
    font-size:56px;
    color:#fff;
    margin-bottom:6px;
  }
  .divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px auto 18px;width:60%;}
  .divider .line{flex:1;height:1px;background:#d9b25c;}
  .divider .dot{width:6px;height:6px;background:#d9b25c;transform:rotate(45deg);}
  h1{font-size:18px;color:#f3dfa0;margin:0 0 14px;}
  p{font-size:14px;line-height:1.9;color:#eef0fa;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo-name">Anna</div>
    <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
    <h1>ご回答ありがとうございました</h1>
    <p>アンケートへのご協力、誠にありがとうございました。<br>
    いただいたご意見は今後の商品開発の参考にさせていただきます。</p>
  </div>
</body>
</html>
