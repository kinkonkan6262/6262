/* 保存済みマスタに新既定行をマージ（名称が無いものだけ追加） */
const mergeItems=(saved,defs)=>{
  const d=withIds(defs);
  if(!saved||!Array.isArray(saved)||saved.length===0)return d;
  const names=new Set(saved.map(i=>i&&i.n));
  let maxId=saved.reduce((a,i)=>Math.max(a,(i&&i.id)||0),0);
  const add=d.filter(x=>!names.has(x.n)).map(x=>({...x,id:++maxId}));
  return add.length?[...saved,...add]:saved;
};

/* ====== 月次集計（実績→回数） ====== */
function calcMonth(md){
  let use=0,out=0,abs=0,kasan=0,meal=0,s1=0,s2=0,iren=0,taiken=0,chiiki=0,kinkyu=0,shuchu=0,teiin=0,hou1=0,hou2=0,zai=0;
  Object.values(md||{}).forEach(v=>{
    if(!v||typeof v!=="object")return;
    if(v.st==="通")use++;
    if(v.st==="外"){use++;out++;}
    if(v.st==="欠")abs++;
    if(v.st==="加")kasan++;
    if(v.st==="在")zai++;
    const on=(v.st==="通"||v.st==="外");
    if(on){
      if(v.meal)meal++; if(v.s1)s1++; if(v.s2)s2++;
      if(v.iren)iren++; if(v.taiken)taiken++; if(v.chiiki)chiiki++;
      if(v.kinkyu)kinkyu++; if(v.shuchu)shuchu++; if(v.teiin)teiin++;
    }
    if(v.hou1)hou1++; if(v.hou2)hou2++;
  });
  return {use,out,abs,kasan,meal,s1,s2,iren,taiken,chiiki,kinkyu,shuchu,teiin,hou1,hou2,zai};
}
const autoCount=(c,p)=>{
  if(p==="日")return c.use; if(p==="食")return c.meal; if(p==="欠")return c.kasan;
  if(p==="送往")return c.s1; if(p==="送復")return c.s2; if(p==="送計")return c.s1+c.s2;
  if(p==="医連")return c.iren; if(p==="体験")return c.taiken; if(p==="地協")return c.chiiki;
  if(p==="集中")return c.shuchu; if(p==="緊受")return c.kinkyu; if(p==="定超")return c.teiin;
  if(p==="訪1")return c.hou1; if(p==="訪2")return c.hou2; if(p==="在宅")return c.zai;
  if(p==="月1")return c.use>0?1:0;
  return 0; /* 回・率 は手入力／別計算 */
};

/* ====== Shift-JIS ダウンロード ====== */
function sjisDownload(text,filename){
  let blob,sjisOk=true;
  try{
    if(typeof Encoding!=="undefined"&&typeof Encoding.convert==="function"){
      const sjis=Encoding.convert(Encoding.stringToCode(text),{to:"SJIS",from:"UNICODE"});
      blob=new Blob([new Uint8Array(sjis)],{type:"text/plain;charset=shift_jis"});
    }else{sjisOk=false;blob=new Blob([text],{type:"text/plain;charset=utf-8"});}
  }catch(e){sjisOk=false;blob=new Blob([text],{type:"text/plain;charset=utf-8"});}
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  return sjisOk;
}
const esc=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';

/* ====== 請求計算 ====== */
function calcBill(user,att,items,counts,office){
  const c=calcMonth(att);
  const rows=[];let base=0;
  const rateItems=[];
  items.filter(i=>i.e).forEach(it=>{
    if(it.p==="率"){rateItems.push(it);return;}
    const ov=(counts||{})[it.id];
    const cnt=(ov!==undefined&&ov!=="")?(parseInt(ov)||0):autoCount(c,it.p);
    if(!cnt)return;
    const unit=parseInt(it.u)||0;if(!unit)return;
    const svc=unit*cnt;base+=svc;
    rows.push({id:it.id,code:String(it.c||"").trim(),name:it.n,unit,cnt,svc});
  });
  rateItems.forEach(it=>{
    const pct=parseFloat(it.pct)||0;if(!pct||base<=0)return;
    const svc=Math.round(base*pct/100);if(!svc)return;
    rows.push({id:it.id,code:String(it.c||"").trim(),name:it.n,unit:svc,cnt:1,svc,isRate:true,pct});
  });
  const totalUnits=rows.reduce((a,r)=>a+r.svc,0);
  const tanka=parseInt(office.tanka)||1000;
  const totalCost=Math.floor(totalUnits*tanka/100);
  const rate=parseInt(user.rate||office.defaultRate||"900")||900;
  const upper=parseInt(user.limit||"0")||0;
  const rawBurden=Math.floor(totalCost*(1000-rate)/1000);
  const determined=upper>0?Math.min(rawBurden,upper):rawBurden;
  const claim=totalCost-determined;
  return {c,rows,totalUnits,tanka,totalCost,rate,upper,rawBurden,determined,claim};
}

  const mv=d=>{const [y,m]=ym.split("-").map(Number);setYm(monthKey(new Date(y,m-1+d,1)));};
  return <div style={{display:"flex",alignItems:"center",gap:6}}>
    <button className="mini" onClick={()=>mv(-1)}>◀ 前月</button>
    <b style={{minWidth:130,textAlign:"center",color:"#283593"}}>{reiwaYM(ym)}（{ym}）</b>
    <button className="mini" onClick={()=>mv(1)}>翌月 ▶</button>
  </div>;
}

    u[ym]=m;return {...p,[uid]:u};
  });
  const getMonth=uid=>((att[uid]||{})[ym])||{};
  const setCnt=(uid,itemId,v)=>setCounts(p=>{
    const m={...(p[ym]||{})};m[uid]={...(m[uid]||{}),[itemId]:v};return {...p,[ym]:m};
  });
  const getCnts=uid=>((counts[ym]||{})[uid])||{};

  /* ---------- CSV生成：J121 明細書 ---------- */
  const buildJ121=()=>{
    const [y2,m2]=ym.split("-").map(Number);
    const ymStr=String(y2)+String(m2).padStart(2,"0");
    const offNo=(office.officeNo||"").trim();
    const warnings=[];const errors=[];
    if(!offNo)errors.push("事業所番号が未設定です（設定タブ）");
    if(!(office.cityNo||"").trim())warnings.push("既定の市町村番号が未設定です（利用者ごとに設定されていれば問題ありません）");
    const prefNo=(office.prefNo||"").trim().padStart(2,"0");
    if(!/^[0-9]{2}$/.test(prefNo))errors.push("都道府県番号（2桁）が正しくありません");
    const tanka=parseInt(office.tanka)||0;
    if(!tanka)errors.push("単位数単価が未設定です");
    const svcType=office.svcType;
    const chiikiCode=(office.chiikiCode||"08").padStart(2,"0");
    const offNo10=offNo.length>=10?offNo:offNo.padEnd(10," ");
    let dataRecs=[];let recSeq=2;let targets=0;const perUser=[];
    users.forEach(u=>{
      const md=getMonth(u.id);
      const bill=calcBill(u,md,items,getCnts(u.id),office);
      if(bill.c.use<=0||bill.totalUnits<=0)return;
      const jukyuRaw=(u.jukyu||"").trim();
      if(!jukyuRaw){warnings.push(u.name+"さん: 受給者証番号が未入力のためCSVに含めません");return;}
      if(!/^[0-9]{1,10}$/.test(jukyuRaw))warnings.push(u.name+"さん: 受給者証番号「"+jukyuRaw+"」の桁数・文字に誤りがある可能性");
      targets++;
      const jukyu=jukyuRaw.padStart(10,"0");
      const cityNo=((u.cityNo||"").trim()||office.cityNo||"").trim();
      if(!/^[0-9]{1,6}$/.test(cityNo))warnings.push(u.name+"さん: 市町村番号「"+cityNo+"」が6桁数字ではありません");
      const cityNo6=cityNo.padStart(6,"0");
      let kana=toHankaku((u.kana||"").trim()).substring(0,25);
      if(!kana)warnings.push(u.name+"さん: フリガナが未入力です");
      const rate=bill.rate;
      if(rate<500||rate>1000)warnings.push(u.name+"さん: 給付率("+rate+")が通常範囲(500〜1000)外です");
      bill.rows.forEach(r=>{
        if(!/^[0-9]{6}$/.test(r.code))warnings.push(u.name+"さん: 「"+r.name+"」のサービスコードが6桁数字ではありません（"+(r.code||"未設定")+"）");
        else if(r.code.substring(0,2)!==svcType)warnings.push(u.name+"さん: 「"+r.name+"」のコード("+r.code+")がサービス種類"+svcType+"と一致しません");
      });
      if(bill.determined<0||bill.claim<0)warnings.push(u.name+"さん: 負担額または請求額がマイナスです。単価・給付率・上限額を確認してください");
      const usedDays=Object.keys(md).map(Number).filter(d=>md[d]&&(md[d].st==="通"||md[d].st==="外")).sort((a,b)=>a-b);
      const firstDay=usedDays[0]||1;
      const startDate=ymStr+String(firstDay).padStart(2,"0");
      /* 01:基本情報 */
      const rec01=["J121","01",ymStr,cityNo6,offNo10,jukyu,"",kana,"",chiikiCode,
        bill.upper>0?String(bill.upper):"","","","","",
        String(bill.c.use),"","","",String(bill.totalUnits),String(bill.totalCost),
        "","","","","",String(bill.determined),String(bill.claim),"","","",""].map(esc).join(",");
      dataRecs.push("2,"+recSeq+","+rec01);recSeq++;
      /* 02:日数情報 */
      const rec02=["J121","02",ymStr,cityNo6,offNo10,jukyu,svcType,startDate,"",String(bill.c.use),"",""].map(esc).join(",");
      dataRecs.push("2,"+recSeq+","+rec02);recSeq++;
      /* 03:明細情報 */
      bill.rows.forEach((r,idx)=>{
        const iCost=Math.floor(r.svc*tanka/100);
        const iKyufu=Math.floor(iCost*rate/1000);
        const rec03=["J121","03",ymStr,cityNo6,offNo10,jukyu,svcType,
          String(idx+1).padStart(2,"0"),r.code.padStart(6,"0"),
          String(r.unit),String(r.cnt),String(r.svc),"",
          String(tanka).padStart(4,"0"),String(iCost),"","",
          String(rate).padStart(4,"0"),String(iKyufu),
          "","","","","","",""].map(esc).join(",");
        dataRecs.push("2,"+recSeq+","+rec03);recSeq++;
      });
      /* 04:集計情報 */
      const rec04=["J121","04",ymStr,cityNo6,offNo10,jukyu,svcType,"1","","",
        String(bill.totalUnits),String(tanka).padStart(4,"0"),String(bill.totalCost),String(bill.rawBurden),
        "",String(bill.determined),"",String(bill.determined),String(bill.claim),"","",""].map(esc).join(",");
      dataRecs.push("2,"+recSeq+","+rec04);recSeq++;
      perUser.push({user:u,bill});
    });
    if(dataRecs.length===0)errors.push("出力対象がありません（受給者証番号・実績・有効な加算設定を確認）");
    /* コントロールレコード：実際に取込できた見本(J121_202607_final.CSV)と同一構造
       1,1,0,<データ件数>,J12,0,<事業所番号>,<都道府県>,11,<提供年月>,0 （全11項目） */
    const ctrl=[1,1,0,dataRecs.length,"J12",0,offNo10,prefNo,"11",ymStr,0].join(",");
    const end="3,"+recSeq;
    const text=[ctrl,...dataRecs,end].join("\r\n")+"\r\n";
    return {text,warnings,errors,targets,dataCount:dataRecs.length,ymStr,perUser,filename:"J121_"+ymStr+".CSV"};
  };

  /* ---------- CSV生成：J611 実績記録票 ---------- */
  const buildJ611=()=>{
    const [y2,m2]=ym.split("-").map(Number);
    const ymStr=String(y2)+String(m2).padStart(2,"0");
    const offNo=(office.officeNo||"").trim();
    const warnings=[];const errors=[];
    if(!offNo)errors.push("事業所番号が未設定です（設定タブ）");
    const nd=new Date(y2,m2,0).getDate();
    const REC01_LEN=174,REC02_LEN=115;
    const ST={"通":"1","外":"2","欠":"3","加":"3"};
    const fmtT=t=>{const d=String(t||"").replace(/[^0-9]/g,"");return d?d.padStart(4,"0"):"";};
    const memoSafe=m=>String(m||"").replace(/,/g,"、").replace(/[\r\n"]/g," ").trim();
    let dataRecs=[];let recSeq=2;let targets=0;
    users.forEach(u=>{
      const jukyuRaw=(u.jukyu||"").trim();
      if(!jukyuRaw)return;
      if(!/^[0-9]{1,10}$/.test(jukyuRaw))warnings.push(u.name+"さん: 受給者証番号「"+jukyuRaw+"」の桁数・文字に誤りがある可能性");
      const jukyu=jukyuRaw.padStart(10,"0");
      const cityNo=((u.cityNo||"").trim()||office.cityNo||"").trim();
      if(!cityNo){warnings.push(u.name+"さん: 市町村番号が未設定のためCSVに含めません");return;}
      const cityNo6=cityNo.padStart(6,"0");
      const md=getMonth(u.id);
      const days=[];
      for(let d=1;d<=nd;d++){
        const v=md[d];if(!v||!v.st)continue;
        const st=ST[v.st];if(!st)continue;
        days.push({d,v,st});
      }
      if(days.length===0)return;
      targets++;
      const useDays=days.filter(e=>e.st!=="3").length;
      const sougei=days.reduce((a,e)=>a+(e.st!=="3"&&e.v.s1?1:0)+(e.st!=="3"&&e.v.s2?1:0),0);
      const meals=days.filter(e=>e.st!=="3"&&e.v.meal).length;
      const outDays=days.filter(e=>e.st==="2").length;
      const cnt=k=>days.filter(e=>e.st!=="3"&&e.v[k]).length;
      const houC1=days.filter(e=>e.v.hou1).length,houC2=days.filter(e=>e.v.hou2).length;
      const irenC=cnt("iren"),taikenC=cnt("taiken"),chiikiC=cnt("chiiki"),
            kinkyuC=cnt("kinkyu"),shuchuC=cnt("shuchu"),teiinC=cnt("teiin");
      const mkRec=recType=>{
        const f=new Array(recType==="01"?REC01_LEN:REC02_LEN).fill("");
        f[0]="2";f[2]="J611";f[3]=recType;f[4]=ymStr;f[5]=cityNo6;f[6]=offNo;f[7]=jukyu;f[8]=youshiki;
        return f;
      };
      const pushRec=f=>{
        f[f.length-1]="0";
        dataRecs.push(f[0]+","+recSeq+","+f.slice(2).map(esc).join(","));recSeq++;
      };
      /* 基本情報(01)：位置は1始まり表記（実測確定済み） */
      const b=mkRec("01");
      if(sougei)b[35]=String(sougei);
      b[38]=String(useDays);
      if(meals)b[46]=String(meals);
      if(houC1)b[52]=String(houC1);
      if(houC2)b[53]=String(houC2);
      if(outDays)b[54]=String(outDays);
      if(irenC)b[118]=String(irenC);
      if(taikenC)b[126]=String(taikenC);
      if(teiinC)b[127]=String(teiinC);
      if(chiikiC)b[153]=String(chiikiC);
      if(shuchuC)b[168]=String(shuchuC);
      if(kinkyuC)b[169]=String(kinkyuC);
      pushRec(b);
      /* 日別情報(02) */
      days.forEach((e,i)=>{
        const f=mkRec("02");
        f[9]=String(i+1);
        f[10]=String(e.d).padStart(2,"0");
        f[11]=e.st;
        if(e.st!=="3"){
          const inT=fmtT(e.v.in),outT=fmtT(e.v.out);
          if(!inT||!outT)warnings.push(u.name+"さん "+m2+"月"+e.d+"日: 開始または終了時間が未入力です");
          else if(Number(outT)<=Number(inT))warnings.push(u.name+"さん "+m2+"月"+e.d+"日: 終了("+outT+")が開始("+inT+")以前になっています");
          f[15]=inT;f[16]=outT;
          if(e.v.s1)f[22]="1";
          if(e.v.s2)f[23]="1";
          const numOnly=x=>String(x==null?"":x).replace(/[^0-9]/g,"");
          if(e.v.hou1)f[28]=numOnly(e.v.hou1);
          if(e.v.hou2)f[29]=numOnly(e.v.hou2);
          if(e.st==="2")f[30]="1";
          if(e.v.meal)f[33]="1";
          if(e.v.iren)f[75]="1";
          if(e.v.taiken)f[84]="1";
          if(e.v.teiin)f[85]="1";
          if(e.v.chiiki)f[97]="1";
          if(e.v.shuchu)f[108]="1";
          if(e.v.kinkyu)f[109]="1";
        }
        const memo=memoSafe(e.v.memo);
        if(memo)f[36]=memo;
        pushRec(f);
      });
    });
    if(dataRecs.length===0)errors.push("出力対象がありません（受給者証番号・市町村番号・実績入力を確認）");
    /* コントロール：1,1,0,件数,J61,0,事業所番号,0,1,年月,0（実測確定済み） */
    const ctrl=[1,1,0,dataRecs.length,"J61",0,offNo,0,1,ymStr,0].join(",");
    const end="3,"+recSeq;
    const text=[ctrl,...dataRecs,end].join("\r\n")+"\r\n";
    return {text,warnings,errors,targets,dataCount:dataRecs.length,ymStr,filename:"実績記録票_"+ymStr+"_取込用.csv"};
  };

  const doDownload=builder=>{
    const r=builder();
    if(r.errors.length){alert("❌ 出力できません：\n\n・"+r.errors.join("\n・"));return;}
    if(r.warnings.length){
      const shown=r.warnings.slice(0,15);
      if(r.warnings.length>15)shown.push("…ほか"+(r.warnings.length-15)+"件");
      if(!window.confirm("⚠️ 電子請求前の確認をお願いします。以下の疑問点があります。\n\n・"+shown.join("\n・")+"\n\nこのままCSVを出力しますか？"))return;
    }
    const sjisOk=sjisDownload(r.text,r.filename);
    alert("✅ CSVを出力しました！\n\n対象利用者: "+r.targets+"名\nデータレコード数: "+r.dataCount+"件\nファイル名: "+r.filename+(sjisOk?"":"\n\n⚠️ Shift-JISライブラリ未読込のためUTF-8で出力されました。オンライン環境で再出力してください。")+"\n\n⚠️ このファイルはExcelで開かないでください（0落ち・項目数変化の原因）。中身の確認は「CSV検査」タブへドロップしてください。");
  };

  return <div style={{maxWidth:1200,margin:"0 auto",padding:14}}>
    <div style={{background:"#3949AB",color:"#fff",borderRadius:8,padding:"12px 16px",marginBottom:10}}>
      <div style={{fontSize:17,fontWeight:"bold"}}>🏛️ 国保連請求CSV作成ツール <span style={{fontSize:13}}>就労継続支援{isA?"A型":"B型"}（令和6年度報酬改定対応）v1.0</span></div>
      <div style={{fontSize:11,opacity:.9,marginTop:2}}>サービス提供実績記録票CSV（J611・実測検証済みレイアウト）／介護給付費等明細書CSV（J121）を生成します</div>
    </div>
    <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
      {[["office","🏢 設定"],["users","👥 利用者"],["att","📅 実績入力"],["items","💴 加算マスタ"],["out","📤 請求・CSV出力"],["check","🔍 CSV検査"],["data","💾 データ管理"]].map(([k,l])=>
        <button key={k} className={"tab"+(tab===k?" on":"")} onClick={()=>setTab(k)}>{l}</button>)}
    </div>
    <div style={{background:"#fff",border:"1px solid #C5CAE9",borderRadius:"0 8px 8px 8px",padding:14}}>
      {tab==="office"&&<OfficeTab office={office} up={upOffice}/>}
      {tab==="users"&&<UsersTab users={users} setUsers={setUsers} office={office}/>}
      {tab==="att"&&<AttTab users={users} ym={ym} setYm={setYm} getMonth={getMonth} setDay={setDay} office={office}/>}
      {tab==="items"&&<ItemsTab items={items} setItems={setItems} isA={isA}/>}
      {tab==="out"&&<OutTab users={users} ym={ym} setYm={setYm} getMonth={getMonth} items={items} getCnts={getCnts} setCnt={setCnt} office={office} buildJ121={buildJ121} buildJ611={buildJ611} doDownload={doDownload} youshiki={youshiki}/>}
      {tab==="check"&&<CheckTab/>}
      {tab==="data"&&<DataTab all={{office,users,att,items45,items46,counts}} restore={d=>{
        if(d.office)setOffice(d.office);if(d.users)setUsers(d.users);if(d.att)setAtt(d.att);
        if(d.items45)setItems45(d.items45);if(d.items46)setItems46(d.items46);if(d.counts)setCounts(d.counts);
      }}/>}
    </div>
    <div className="note" style={{marginTop:10}}>
      ⚠️ <b>重要：</b>単位数・サービスコードの既定値は令和6年度報酬改定ベースの<b>参考値</b>です。請求前に必ず最新の「障害福祉サービス費等の報酬算定構造・サービスコード表」と貴事業所の届出内容で確認し、加算マスタで修正してください。
      B型（様式{"1701"}）は実際の取込成功実績のあるレイアウトです。<b>A型で初めて使用する際は、必ず電子請求受付システムのテスト（到達確認）で通過を確認してから本番提出してください。</b>
      提出には電子証明書が必要です。生成CSVはShift-JIS・CRLF形式です。
    </div>
  </div>;
}

/* ---------------- 設定タブ ---------------- */
function OfficeTab({office,up}){
  const isA=office.svcType==="45";
  const F=({label,k,w,ph,maxLength})=><label style={{display:"inline-flex",flexDirection:"column",gap:2,marginRight:14,marginBottom:10}}>
    <span style={{fontSize:11,color:"#5C6BC0"}}>{label}</span>
    <input style={{width:w||140}} value={office[k]||""} placeholder={ph||""} maxLength={maxLength} onChange={e=>up(k,e.target.value)}/>
  </label>;
  return <div>
    <Sec title="事業所情報">
      <label style={{display:"inline-flex",flexDirection:"column",gap:2,marginRight:14,marginBottom:10}}>
        <span style={{fontSize:11,color:"#5C6BC0"}}>サービス種別</span>
        <select value={office.svcType} onChange={e=>up("svcType",e.target.value)} style={{width:220}}>
          <option value="46">就労継続支援B型（サービス種類46）</option>
          <option value="45">就労継続支援A型（サービス種類45）</option>
        </select>
      </label>
      <F label="事業所番号（10桁）" k="officeNo" ph="4510000000" maxLength={10}/>
      <F label="事業所名" k="officeName" w={220}/>
      <F label="都道府県番号（2桁）" k="prefNo" ph="45" maxLength={2} w={80}/>
      <F label="既定の市町村番号（6桁）" k="cityNo" ph="452016" maxLength={6} w={110}/>
      <div className="note">市町村番号は<b>支給決定を行った市町村</b>の番号です。利用者ごとに異なる場合は「👥利用者」タブで個別に設定してください（未設定の利用者はここの既定値を使用）。</div>
    </Sec>
    <Sec title="単価・地域区分">
      <label style={{display:"inline-flex",flexDirection:"column",gap:2,marginRight:14}}>
        <span style={{fontSize:11,color:"#5C6BC0"}}>地域区分</span>
        <select value={office.chiikiCode} onChange={e=>{const c=CHIIKI.find(x=>x.code===e.target.value);up("chiikiCode",e.target.value);if(c)up("tanka",c.tanka);}}>
          {CHIIKI.map(c=><option key={c.code} value={c.code}>{c.label}（{(c.tanka/100).toFixed(2)}円）</option>)}
        </select>
      </label>
      <label style={{display:"inline-flex",flexDirection:"column",gap:2,marginRight:14}}>
        <span style={{fontSize:11,color:"#5C6BC0"}}>単位数単価（円×100 例:10.00円→1000）</span>
        <input style={{width:100}} value={office.tanka} onChange={e=>up("tanka",e.target.value.replace(/[^0-9]/g,""))}/>
      </label>
      <F label="既定給付率（900=9割）" k="defaultRate" w={100} maxLength={4}/>
      <div className="note">単価は就労系の目安値です。貴事業所の所在地域・サービスに適用される正確な単価（告示別表）を確認して上書きしてください。</div>
    </Sec>
    <Sec title="実績記録票・その他">
      <F label={"実績記録票の様式番号（空欄なら "+(isA?"1601(A型)":"1701(B型)")+"）"} k="youshiki" w={110} maxLength={4}/>
      <F label="既定の開始時間（HHMM）" k="defIn" w={90} maxLength={4}/>
      <F label="既定の終了時間（HHMM）" k="defOut" w={90} maxLength={4}/>
      {isA&&<div className="warn">A型の実績記録票様式番号は「1601」を既定にしています。取込エラーになる場合は国保連へ様式番号をご確認のうえ変更してください。A型減免（事業者減免）を行っている場合、本ツールの明細書CSVは減免欄に対応していないため、該当利用者のみ簡易入力システムでの入力をご検討ください。</div>}
    </Sec>
  </div>;
}

/* ---------------- 利用者タブ ---------------- */
function UsersTab({users,setUsers,office}){

  const up=(id,k,v)=>setUsers(p=>p.map(u=>u.id===id?{...u,[k]:v}:u));
  const del=id=>{const u=users.find(x=>x.id===id);if(window.confirm((u&&u.name||"この利用者")+" を削除しますか？（実績データは残りますが表示されなくなります）"))setUsers(p=>p.filter(x=>x.id!==id));};
  return <div>
    <div style={{marginBottom:8,display:"flex",gap:8,alignItems:"center"}}>
      <button className="act" style={{background:"#3949AB"}} onClick={add}>＋ 利用者を追加</button>
      <span style={{fontSize:12,color:"#666"}}>{users.length}名登録済み</span>
    </div>
    <div style={{overflowX:"auto"}}>
    <table style={{width:"100%",fontSize:12}}>
      <thead><tr><th>氏名</th><th>フリガナ（半角ｶﾅ自動変換）</th><th>受給者証番号(10桁)</th><th>市町村番号(6桁)<br/><span style={{fontWeight:"normal"}}>空欄=既定{office.cityNo?("("+office.cityNo+")"):""}</span></th><th>負担上限月額(円)</th><th>給付率<br/><span style={{fontWeight:"normal"}}>空欄=900</span></th><th></th></tr></thead>
      <tbody>
        {users.map(u=><tr key={u.id}>

function ItemsTab({items,setItems,isA}){
  const up=(id,k,v)=>setItems(p=>p.map(i=>i.id===id?{...i,[k]:v}:i));
  const add=()=>setItems(p=>[...p,{id:p.reduce((a,i)=>Math.max(a,i.id),0)+1,c:"",n:"（新規項目）",u:"",p:"日",e:false}]);
  const del=id=>{if(window.confirm("この行を削除しますか？"))setItems(p=>p.filter(i=>i.id!==id));};
  const reset=()=>{if(window.confirm("加算マスタを既定値に戻します。編集内容は失われます。よろしいですか？"))setItems(withIds(isA?DEF45:DEF46));};
  /* 公式サービスコード表CSV等からの単位数取込 */
  const fileRef=useRef(null);
  const importMaster=file=>{
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const buf=new Uint8Array(reader.result);
        const uni=Encoding.convert(buf,{to:"UNICODE",from:Encoding.detect(buf),type:"string"});
        const lines=uni.split(/\r?\n/).filter(l=>l.trim());
        const map={};
        const pfx=isA?"45":"46";
        lines.forEach(l=>{
          const f=l.split(",").map(x=>x.replace(/^"|"$/g,"").trim());
          let code=null;
          for(let i=0;i<f.length;i++){
            if(/^\d{6}$/.test(f[i])&&f[i].substring(0,2)===pfx){code=f[i];break;}
            if(f[i]===pfx&&i+1<f.length&&/^\d{4}$/.test(f[i+1])){code=pfx+f[i+1];break;}
          }
          if(!code)return;
          const nums=f.filter(x=>/^-?\d{1,5}$/.test(x)&&x!==code.substring(0,2)&&x!==code.substring(2));
          const unit=nums.length?nums[nums.length-1]:null;
          map[code]={unit,row:f};
        });
        let hit=0;
        setItems(p=>p.map(i=>{
          const code=String(i.c||"").trim();
          if(code&&map[code]&&map[code].unit!=null){hit++;return {...i,u:String(map[code].unit)};}
          return i;
        }));
        alert("マスタ取込完了：コード一致 "+hit+" 件の単位数を更新しました。\n（コード表内の候補コード数: "+Object.keys(map).length+"）\n\n※取込結果は必ず目視で確認してください。列構成によっては正しく読めない場合があります。");
      }catch(e){alert("読み込みに失敗しました: "+e.message);}
    };
    reader.readAsArrayBuffer(file);
  };
  return <div>
    <div style={{display:"flex",gap:8,marginBottom:8,flexWrap:"wrap"}}>
      <button className="act" style={{background:"#3949AB"}} onClick={add}>＋ 行を追加</button>
      <button className="mini" onClick={reset}>既定値に戻す</button>
      <button className="mini" onClick={()=>fileRef.current&&fileRef.current.click()}>📥 サービスコード表CSVから単位数を取込</button>
      <input type="file" accept=".csv,.txt" style={{display:"none"}} ref={fileRef} onChange={e=>{if(e.target.files[0])importMaster(e.target.files[0]);e.target.value="";}}/>
    </div>
    <div style={{overflowX:"auto"}}>
    <table style={{width:"100%",fontSize:12}}>
      <thead><tr><th>有効</th><th>サービスコード(6桁)</th><th>名称</th><th>単位数</th><th>率%<br/><span style={{fontWeight:"normal"}}>(処遇改善等)</span></th><th>算定方法</th><th></th></tr></thead>
      <tbody>
        {items.map(i=><tr key={i.id} style={{background:i.m?"#FFF3E0":i.e?"#E8F5E9":"#fff"}}>
          <td style={{textAlign:"center"}}><input type="checkbox" checked={!!i.e} onChange={e=>up(i.id,"e",e.target.checked)}/></td>
          <td><input className="mono" style={{width:80}} maxLength={6} value={i.c||""} onChange={e=>up(i.id,"c",e.target.value.replace(/[^0-9]/g,""))}/></td>
          <td><input style={{width:"100%",minWidth:280}} value={i.n} onChange={e=>up(i.id,"n",e.target.value)}/></td>
          <td><input className="mono" style={{width:70}} value={i.u||""} onChange={e=>up(i.id,"u",e.target.value.replace(/[^0-9-]/g,""))}/></td>
          <td>{i.p==="率"?<input className="mono" style={{width:60}} value={i.pct||""} placeholder="8.1" onChange={e=>up(i.id,"pct",e.target.value.replace(/[^0-9.]/g,""))}/>:"－"}</td>
          <td><select value={i.p} onChange={e=>up(i.id,"p",e.target.value)}>
            {PERS.map(pp=><option key={pp[0]} value={pp[0]}>{pp[0]}：{pp[1]}</option>)}
          </select></td>
          <td><button className="mini" onClick={()=>del(i.id)}>🗑</button></td>
        </tr>)}

    <div className="note" style={{marginTop:8}}>
      ・「率」（処遇改善加算等）は、有効な他項目の合計単位数×率%（四捨五入）で自動計算されます。届出区分の率とサービスコードを必ず入力してください。<br/>
      ・減算はオレンジ色の行です。単位数に<b>マイナス値</b>を入れ、算定方法「回」で回数を出力タブから手入力してください。<br/>
      ・既定の単位数は令和6年度報酬改定ベースの参考値です。<b>定員規模・人員配置・スコア（A型）・平均工賃（B型）で変わる項目が多数あります。</b>必ず最新のサービスコード表で確認してください。
    </div>
  </div>;
}

/* ---------------- CSV検査タブ ---------------- */
function CheckTab(){
  const [report,setReport]=useState(null);
  const [preview,setPreview]=useState([]);
  const fileRef=useRef(null);
  const J121LEN={"01":34,"02":14,"03":28,"04":24};
  const inspect=file=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const buf=new Uint8Array(reader.result);
      let text;
      try{text=Encoding.convert(buf,{to:"UNICODE",from:Encoding.detect(buf),type:"string"});}
      catch(e){setReport({errors:["文字コードを判定できませんでした: "+e.message],warns:[],infos:[]});return;}
      const errors=[],warns=[],infos=[];
      const enc=Encoding.detect(buf);
      const encOk=(enc==="SJIS"||enc==="ASCII"||enc==="BINARY");
      infos.push("文字コード判定: "+enc+(encOk?"（OK・Shift-JIS互換）":"（⚠️ 国保連はShift-JISが必要です）"));
      if(!encOk)warns.push("文字コードがShift-JISではない可能性があります（判定:"+enc+"）");
      const hasCRLF=/\r\n/.test(text);
      if(!hasCRLF)warns.push("改行コードがCRLFではない可能性があります");
      const rawLines=text.split(/\r\n|\n/).filter(l=>l!=="");
      if(rawLines.length<3){errors.push("行数が少なすぎます（コントロール+データ+エンドの3行以上が必要）");setReport({errors,warns,infos});return;}
      /* CSVパース（ダブルクォート対応） */
      const parse=l=>{
        const out=[];let cur="";let q=false;
        for(let i=0;i<l.length;i++){
          const ch=l[i];
          if(q){
            if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}
            else cur+=ch;
          }else{
            if(ch==='"')q=true;
            else if(ch===","){out.push(cur);cur="";}
            else cur+=ch;
          }
        }
        out.push(cur);return out;
      };
      const rows=rawLines.map(parse);
      const ctrl=rows[0],end=rows[rows.length-1],data=rows.slice(1,rows.length-1);
      /* コントロール */
      if(ctrl[0]!=="1")errors.push("1行目がコントロールレコード（先頭1）ではありません");
      if(ctrl.length!==11)warns.push("コントロールレコードの項目数が11ではありません（"+ctrl.length+"項目）");
      const declared=parseInt(ctrl[3])||0;
      if(declared!==data.length)errors.push("コントロールのデータ件数("+declared+")と実データ行数("+data.length+")が一致しません");
      const kind=ctrl[4];
      infos.push("交換情報: "+kind+"／提供年月: "+(ctrl[9]||"?")+"／データ"+data.length+"件");
      if(!/^\d{6}$/.test(String(ctrl[9])))warns.push("コントロールの提供年月（10項目め）が6桁数字ではありません: "+ctrl[9]);
      /* エンド */
      if(end[0]!=="3")errors.push("最終行がエンドレコード（先頭3）ではありません");
      else{
        const endN=parseInt(end[1])||0;
        if(endN!==data.length+2)warns.push("エンドレコードの値("+endN+")が総レコード数("+(data.length+2)+")と一致しません");
      }
      /* データ行 */
      let seqOk=true;
      data.forEach((f,i)=>{
        const rowNo=i+2;
        if(f[0]!=="2")errors.push(rowNo+"行目: 先頭が2（データレコード）ではありません");
        if(parseInt(f[1])!==i+2)seqOk=false;
        const id=f[2],rt=f[3];
        if(kind==="J61"){
          if(id!=="J611")errors.push(rowNo+"行目: 交換情報識別が J611 ではありません("+id+")");
          const expected=rt==="01"?174:rt==="02"?115:null;
          if(expected==null)errors.push(rowNo+"行目: レコード種別("+rt+")が不明です");
          else if(f.length!==expected)errors.push(rowNo+"行目: 項目数"+f.length+"（正: "+expected+"）");
          if(f[7]&&!/^\d{10}$/.test(f[7]))warns.push(rowNo+"行目: 受給者証番号が10桁数字ではありません("+f[7]+")");
        }else if(kind==="J12"){
          if(id!=="J121")errors.push(rowNo+"行目: 交換情報識別が J121 ではありません("+id+")");
          const expected=J121LEN[rt];
          if(!expected)errors.push(rowNo+"行目: レコード種別("+rt+")が不明です");
          else if(f.length!==expected)warns.push(rowNo+"行目: 項目数"+f.length+"（本ツール標準: "+expected+"）");
          if(f[5]&&!/^\d{10}$/.test(f[5])&&rt!=="01")warns.push(rowNo+"行目: 受給者証番号が10桁数字ではありません("+f[5]+")");
        }
      });
      if(!seqOk)errors.push("レコード通番（2列目）が2から連番になっていません");
      /* J121 合計突合 */
      if(kind==="J12"){
        const byUser={};
        data.forEach(f=>{
          const key=f[5];byUser[key]=byUser[key]||{sum03:0,total01:null,total04:null};
          if(f[3]==="03")byUser[key].sum03+=parseInt(f[13])||0;
          if(f[3]==="01")byUser[key].total01=parseInt(f[21])||0;
          if(f[3]==="04")byUser[key].total04=parseInt(f[12])||0;
        });
        Object.keys(byUser).forEach(k=>{
          const b=byUser[k];
          if(b.total01!=null&&b.sum03!==b.total01)warns.push("受給者証"+k+": 明細(03)の単位数合計("+b.sum03+")と基本情報(01)の総単位数("+b.total01+")が不一致");
        });
      }
      if(errors.length===0)infos.push("構造チェック合格 ✅");
      setReport({errors,warns,infos});
      setPreview(rows.slice(0,30));
    };
    reader.readAsArrayBuffer(file);
  };
  return <div>
    <div className="card" style={{textAlign:"center",border:"2px dashed #7986CB",cursor:"pointer"}}
      onClick={()=>fileRef.current&&fileRef.current.click()}
      onDragOver={e=>e.preventDefault()}
      onDrop={e=>{e.preventDefault();if(e.dataTransfer.files[0])inspect(e.dataTransfer.files[0]);}}>
      <div style={{fontSize:15,fontWeight:"bold",color:"#3949AB"}}>📂 生成したCSVをここにドロップ（またはクリックして選択）</div>
      <div style={{fontSize:12,color:"#666",marginTop:4}}>Shift-JISのままドロップしてください（Excelで開いて保存し直したファイルは壊れています）</div>
      <input type="file" accept=".csv,.CSV,.txt" style={{display:"none"}} ref={fileRef} onChange={e=>{if(e.target.files[0])inspect(e.target.files[0]);e.target.value="";}}/>
    </div>
    {report&&<div>
      {report.errors.length>0&&<div className="warn" style={{marginBottom:8}}><b>❌ エラー（要修正）</b><br/>{report.errors.map((e,i)=><div key={i}>・{e}</div>)}</div>}
      {report.warns.length>0&&<div className="note" style={{marginBottom:8}}><b>⚠️ 警告（確認推奨）</b><br/>{report.warns.map((e,i)=><div key={i}>・{e}</div>)}</div>}
      <div className="ok" style={{marginBottom:8}}>{report.infos.map((e,i)=><div key={i}>・{e}</div>)}</div>
      {preview.length>0&&<div style={{overflowX:"auto"}}>
        <table style={{fontSize:11,whiteSpace:"nowrap"}}>
          <tbody>{preview.map((r,i)=><tr key={i}><th>{i+1}</th>{r.slice(0,20).map((c,j)=><td key={j} className="mono">{c}</td>)}{r.length>20&&<td>…全{r.length}項目</td>}</tr>)}</tbody>
        </table>
        <div style={{fontSize:11,color:"#666"}}>先頭30行×20項目のプレビュー</div>
      </div>}
    </div>}
  </div>;
}

/* ---------------- データ管理タブ ---------------- */
function DataTab({all,restore}){
  const fileRef=useRef(null);
  const backup=()=>{
    const blob=new Blob([JSON.stringify(all,null,1)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;
    a.download="国保連CSVツール_バックアップ_"+new Date().toISOString().slice(0,10)+".json";a.click();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
  };
  const doRestore=file=>{
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const d=JSON.parse(reader.result);
        if(!window.confirm("バックアップから復元します。現在のデータは上書きされます。よろしいですか？"))return;
        restore(d);alert("✅ 復元しました");
      }catch(e){alert("読み込み失敗: "+e.message);}
    };
    reader.readAsText(file);
  };
  return <div>
    <Sec title="バックアップ・復元">
      <button className="act" style={{background:"#3949AB",marginRight:8}} onClick={backup}>💾 バックアップをダウンロード</button>
      <button className="act" style={{background:"#00695C"}} onClick={()=>fileRef.current&&fileRef.current.click()}>📂 バックアップから復元</button>
      <input type="file" accept=".json" style={{display:"none"}} ref={fileRef} onChange={e=>{if(e.target.files[0])doRestore(e.target.files[0]);e.target.value="";}}/>
      <div className="note" style={{marginTop:8}}>データはこのブラウザ内（localStorage）に保存されます。パソコンの変更・ブラウザ履歴削除に備え、月次請求のたびにバックアップを取ることを推奨します。</div>
    </Sec>
    <Sec title="提出前チェックリスト">
      <div style={{fontSize:12,lineHeight:2}}>
        ☐ 加算マスタの単位数・サービスコードを最新のサービスコード表で確認した<br/>
        ☐ 「請求・CSV出力」の合計額が手元の計算・前月実績と大きく乖離していない<br/>
        ☐ 生成CSVを「CSV検査」タブでチェックしエラーがない<br/>
        ☐ CSVをExcelで開いていない（開くと0落ち・項目数変化で取込エラーになります）<br/>
        ☐ 初回・様式変更後は電子請求受付システムのテスト送信（到達確認）で通過を確認した<br/>
        ☐ 提出期限（毎月10日）に間に合うよう送信した
      </div>
    </Sec>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
