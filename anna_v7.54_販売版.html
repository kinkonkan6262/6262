function ZaittakuTab({sel,names,allData,setAllData,att,setAtt,office}){
  const [ym,setYm]=useState(monthKey(new Date()));
  const [busy,setBusy]=useState(false);
  const [printAll,setPrintAll]=useState(false);

  const ZAITTAKU_KEY=(name)=>officeKey("zaittaku_"+name+"_"+ym);

  // 在宅記録データの取得・保存
  const getZData=(name)=>{
    try{ return JSON.parse(localStorage.getItem(ZAITTAKU_KEY(name))||"null")||{}; }catch(e){ return {}; }
  };
  const setZData=(name,data)=>{
    try{ localStorage.setItem(ZAITTAKU_KEY(name),JSON.stringify(data)); }catch(e){}
  };

  const [y2,m2]=ym.split("-").map(Number);
  const nd=new Date(y2,m2,0).getDate();
  const WD3=["\u65E5","\u6708","\u706B","\u6C34","\u6728","\u91D1","\u571F"];

  // 対象利用者
  const targets=printAll?names:(sel?[sel]:[]);

  // 1人分の在宅記録カード
  const ZCard=({name})=>{
    const [zd,setZdState]=useState(()=>getZData(name));
    const upZ=(day,key,val)=>{
      const next={...zd,[day]:{...(zd[day]||{}),[key]:val}};
      setZdState(next);
      setZData(name,next);
      // 支援内容 → 実績記録memoにも反映
      if(setAtt&&(key==="shien"||key==="shien_ai")){
        setAtt(prev=>{
          const pm=prev[ym]||{};
          const pd=pm[day]||{};
          return {...prev,[ym]:{...pm,[day]:{...pd,memo:val}}};
        });
      }
      // 在宅フラグ → 実績記録stにも反映
      if(setAtt&&(key==="st")){
        setAtt(prev=>{
          const pm=prev[ym]||{};
          const pd=pm[day]||{};
          const newSt=val==="\u5728\u5B85"?"\u5728":"";
          return {...prev,[ym]:{...pm,[day]:{...pd,st:newSt||pd.st}}};
        });
      }
    };
    const [aiText,setAiText]=useState({});
    const genAI=async(day)=>{
      const d=zd[day]||{};
      setBusy(true);
      const r=await ai(OFC()+"\u3001\u5229\u7528\u8005\u300C"+name+"\u300D\u5728\u5B85\u652F\u63F4\u8A18\u9332\u3002\u65E5\u4ED8:"+y2+"/"+m2+"/"+day+"\u3002\u9023\u7D61\u4E8B\u9805:\u300C"+(d.renraku||"")+"\u300D\u3001\u652F\u63F4\u5185\u5BB9:\u300C"+(d.shien||"")+"\u300D\u3002\u3010\u672C\u65E5\u306E\u69D8\u5B50\u3011\u3010\u652F\u63F4\u5185\u5BB9\u3011\u3010\u4ECA\u5F8C\u306E\u7559\u610F\u70B9\u3011\u306E\u5F62\u5F0F\u3067\u6574\u7406\u3002\u6587\u7AE0\u306E\u307F\u3002");
      if(r){ setAiText(prev=>({...prev,[day]:r.trim()})); upZ(day,"shien_ai",r.trim()); }
      setBusy(false);
    };

    // 在宅日一覧（att から在宅日を取得）
    const attMonth=(att||{})[ym]||{};
    const zaitakuDays=[];
    for(let d=1;d<=nd;d++){
      const v=attMonth[d]||{};
      if(v.st==="\u5728") zaitakuDays.push(d);
    }

    const u=allData[name]||{};
    const jukyu=u.jukyu||"";

    return <div style={{marginBottom:20}}>
      {/* ヘッダー情報 */}
      <div style={{background:"#E8F5E9",border:"2px solid #388E3C",borderRadius:6,padding:"10px 14px",marginBottom:8}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
          <div style={{fontWeight:"bold",fontSize:14,color:"#1B5E20"}}>🏠 在宅支援記録 ― {name}</div>
          <div style={{fontSize:11,color:"#555"}}>{fmtYM(ym)} ／ 受給者証番号：{jukyu||"\u672A\u5165\u529B"}</div>
        </div>
        <div style={{fontSize:11,marginTop:4,color:"#388E3C"}}>
          事業所：{office.name||""} ／ サービス管理責任者：{office.kanri||""}
        </div>
      </div>

      {/* 在宅記録テーブル */}
      <div style={{overflowX:"auto",marginBottom:8}}>
      <table style={{width:"100%",borderCollapse:"collapse",minWidth:700}}>
        <thead>
          <tr style={{background:"#1B5E20"}}>
            <th style={{...th,color:"#fff",width:"6%"}}>日</th>
            <th style={{...th,color:"#fff",width:"5%"}}>曜</th>
            <th style={{...th,color:"#fff",width:"10%"}}>開始時刻</th>
            <th style={{...th,color:"#fff",width:"10%"}}>終了時刻</th>
            <th style={{...th,color:"#fff",width:"20%"}}>連絡事項・本人の様子</th>
            <th style={{...th,color:"#fff",width:"28%"}}>支援内容</th>
            <th style={{...th,color:"#fff",width:"10%"}}>担当職員</th>
            <th style={{...th,color:"#fff",width:"11%",fontSize:10}}>提出状況</th>
          </tr>
        </thead>
        <tbody>
          {Array.from({length:nd},(_,i)=>i+1).map(d=>{
            const wd=new Date(y2,m2-1,d).getDay();
            const dd=zd[d]||{};
            const isZaittaku=dd.st==="\u5728\u5B85"||(attMonth[d]||{}).st==="\u5728";
            const bg=isZaittaku?"#F1F8E9":(wd===0?"#FFF5F5":wd===6?"#F0F7FF":"#fff");
            const inp2={width:"100%",padding:"2px 4px",fontSize:10,border:"1px solid #ddd",borderRadius:3};
            return <tr key={d} style={{background:bg}}>
              <td style={{...td,textAlign:"center",fontWeight:"bold"}}>{d}</td>
              <td style={{...td,textAlign:"center",color:wd===0?"#C62828":wd===6?"#1565C0":"#444",fontSize:11}}>{WD3[wd]}</td>
              <td style={{...td,padding:"2px"}}>
                {isZaittaku
                  ?<input value={dd.in||""} onChange={e=>upZ(d,"in",e.target.value)}
                    placeholder={"\u4F8B: 10:00"} style={inp2}/>
                  :<span style={{color:"#ccc",fontSize:10}}>－</span>}
              </td>
              <td style={{...td,padding:"2px"}}>
                {isZaittaku
                  ?<input value={dd.out||""} onChange={e=>upZ(d,"out",e.target.value)}
                    placeholder={"\u4F8B: 11:00"} style={inp2}/>
                  :<span style={{color:"#ccc",fontSize:10}}>－</span>}
              </td>
              <td style={{...td,padding:"2px"}}>
                {isZaittaku
                  ?<input value={dd.renraku||""} onChange={e=>upZ(d,"renraku",e.target.value)}
                    placeholder={"\u9023\u7D61\u5185\u5BB9\u3092\u5165\u529B"} style={inp2}/>
                  :<span style={{color:"#ccc",fontSize:10}}>－</span>}
              </td>
              <td style={{...td,padding:"2px"}}>
                {isZaittaku
                  ?<div style={{display:"flex",gap:3,alignItems:"center"}}>
                    <textarea value={aiText[d]||dd.shien||(attMonth[d]||{}).memo||""} onChange={e=>{upZ(d,"shien",e.target.value);setAiText(prev=>({...prev,[d]:e.target.value}));}}
                      rows={2} placeholder={"\u652F\u63F4\u5185\u5BB9\u3092\u5165\u529B"}
                      style={{...inp2,resize:"vertical",fontSize:10}}/>
                    <button className="np" onClick={()=>genAI(d)} disabled={busy}
                      style={{fontSize:9,padding:"2px 4px",background:"#FFF8E1",border:"1px solid #FFE082",borderRadius:3,cursor:"pointer",whiteSpace:"nowrap"}}>
                      🤖AI
                    </button>
                  </div>
                  :<span style={{color:"#ccc",fontSize:10}}>－</span>}
              </td>
              <td style={{...td,padding:"2px"}}>
                {isZaittaku
                  ?<input value={dd.staff||""} onChange={e=>upZ(d,"staff",e.target.value)}
                    placeholder={"\u62C5\u5F53\u8005\u540D"} style={inp2}/>
                  :<span style={{color:"#ccc",fontSize:10}}>－</span>}
              </td>
              <td style={{...td,padding:"2px",textAlign:"center"}}>
                {isZaittaku
                  ?<select value={dd.teishutsu||""} onChange={e=>upZ(d,"teishutsu",e.target.value)}
                    style={{width:"100%",fontSize:10,border:"1px solid #ddd",borderRadius:3,padding:"2px"}}>
                    <option value="">未提出</option>
                    <option value="提出済">提出済</option>
                    <option value="確認済">確認済</option>
                    <option value="在宅">在宅</option>
                  </select>
                  :<span style={{color:"#ccc",fontSize:10}}>－</span>}
              </td>
            </tr>;
          })}
        </tbody>
      </table>
      </div>
      {zaitakuDays.length===0&&<div style={{background:"#FFF8E1",border:"1px solid #FFE082",borderRadius:5,padding:"8px 12px",fontSize:11,color:"#666"}}>
        💡 実績記録タブで「在」（在宅）を設定すると、この画面に在宅日が表示されます。
      </div>}
      {/* 集計 */}
      {zaitakuDays.length>0&&<div style={{background:"#E8F5E9",border:"1px solid #A5D6A7",borderRadius:5,padding:"8px 12px",fontSize:11,color:"#1B5E20",fontWeight:"bold",marginBottom:12}}>
        📊 在宅支援日数：{zaitakuDays.length}日 ／ 提出済：{Object.values(zd).filter(v=>v.teishutsu==="\u63D0\u51FA\u6E08"||v.teishutsu==="\u78BA\u8A8D\u6E08").length}件
      </div>}

      {/* ===== 在宅支援の評価（写真様式準拠） ===== */}
      <ZHyokaSection zd={zd} upZ={upZ} name={name} ym={ym} office={office} genAI={genAI} busy={busy} zaitakuDays={zaitakuDays} attMonth={attMonth}/>
    </div>;
  };

  return <div style={{padding:14}}>
    <Header title={"\u1F3E0 \u5728\u5B85\u652F\u63F4\u8A18\u9332 \u2015 "+fmtYM(ym)}>
      <PrtBtn/>
    </Header>
    <div className="np" style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:10}}>
      <MonthNav ym={ym} setYm={setYm}/>
      <label style={{fontSize:11,display:"flex",alignItems:"center",gap:4,cursor:"pointer"}}>
        <input type="checkbox" checked={printAll} onChange={e=>setPrintAll(e.target.checked)} style={{accentColor:"#388E3C"}}/>
        全員まとめて表示・印刷
      </label>
    </div>
    <div style={{background:"#FFF8E1",border:"1px solid #FFE082",borderRadius:5,padding:"6px 12px",marginBottom:10,fontSize:11,color:"#555"}}>
      💡 実績記録タブで出欠区分を「在」（在宅）に設定すると、この画面の該当日に在宅記録欄が表示されます。支援内容はAIで自動生成できます。
    </div>
    {targets.length===0&&<div style={{textAlign:"center",padding:30,color:"#999"}}>利用者を選択するか「全員まとめて表示・印刷」にチェックしてください</div>}
    {targets.map(name=><ZCard key={name} name={name}/>)}
  </div>;
}

function OutsideTab({names,allData,office,svcLabel}){
  const [ym,setYm]=useState(monthKey(new Date()));
  const [busy,setBusy]=useState(false);
  const [aiPlan,setAiPlan]=useState("");
  const [viewDay,setViewDay]=useState(null); // 日付クリックで当日詳細

  const WD2=["\u65E5","\u6708","\u706B","\u6C34","\u6728","\u91D1","\u571F"];

  const [y2,m2]=ym.split("-").map(Number);
  const nd=new Date(y2,m2,0).getDate();

  // 月全体の施設外就労一覧
  const rows=names.map(n=>{
    const u=allData[n]||{};
    const md=(u.att||{})[ym]||{};
    const outDays=[];
    for(let d=1;d<=nd;d++){
      const v=md[d]||{};
      if(v.st==="\u5916"){
        const dt=new Date(y2,m2-1,d);
        outDays.push({d,wd:WD2[dt.getDay()],in:v.in||"",out:v.out||"",memo:v.memo||""});
      }
    }
    const {use}=getAttDays(u.att||{},ym);
    return {n,jukyu:u.jukyu||"",outDays,outCount:outDays.length,inCount:use};
  }).filter(r=>r.outCount>0||r.inCount>0);

  // 当日集計（施設外+通所）
  const buildDayReport=(day)=>{
    const outsideList=[];
    const insideList=[];
    names.forEach(n=>{
      const u=allData[n]||{};
      const md=(u.att||{})[ym]||{};
      const v=md[day]||{};
      if(v.st==="\u5916") outsideList.push({n,in:v.in||"",out:v.out||"",memo:v.memo||""});
      else if(v.st==="\u901A") insideList.push({n,in:v.in||"",out:v.out||"",memo:v.memo||""});
    });
    return {day,wd:WD2[new Date(y2,m2-1,day).getDay()],outsideList,insideList};
  };

  const totalOut=rows.reduce((a,r)=>a+r.outCount,0);

  // 利用日集計マトリクス用データ（施設外／施設内=通所+在宅）
  const days=Array.from({length:nd},(_,i)=>i+1);
  const stOf=(n,d)=>(((allData[n]||{}).att||{})[ym]||{})[d]&&(((allData[n]||{}).att||{})[ym]||{})[d].st||"";
  const outByDay=days.map(d=>names.filter(n=>stOf(n,d)==="\u5916").length);
  const inByDay=days.map(d=>names.filter(n=>{const st=stOf(n,d);return st==="\u901A"||st==="\u5728";}).length);
  const sumArr=a=>a.reduce((x,y)=>x+y,0);
  const gcell={border:"1px solid #999",padding:"2px 3px",fontSize:10,textAlign:"center",whiteSpace:"nowrap"};

  const dlCsv=()=>{
    const esc=v=>'"'+String(v).replace(/"/g,'""')+'"';
    let lines=[["\u6C0F\u540D","\u53D7\u7D66\u8005\u8A3C\u756A\u53F7","\u65E5","\u66DC\u65E5","\u533A\u5206","\u958B\u59CB","\u7D42\u4E86","\u5099\u8003"].map(esc).join(",")];
    names.forEach(n=>{
      const u=allData[n]||{};
      const md=(u.att||{})[ym]||{};
      for(let d=1;d<=nd;d++){
        const v=md[d]||{};
        if(v.st==="\u5916"||v.st==="\u901A"){
          const dt=new Date(y2,m2-1,d);
          lines.push([n,u.jukyu||"",d,WD2[dt.getDay()],v.st==="\u5916"?"\u65BD\u8A2D\u5916\u5C31\u52B4":"\u901A\u6240",v.in||"",v.out||"",v.memo||""].map(esc).join(","));
        }
      }
    });
    const blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="\u65BD\u8A2D\u5916\u5C31\u52B4_"+ym+".csv";a.click();
    URL.revokeObjectURL(url);
  };

  const genAI=async()=>{
    setBusy(true);setAiPlan("");
    const summary=rows.filter(r=>r.outCount>0).map(r=>`${r.n}:施設外${r.outCount}日`).join("\u3001");
    const txt=await ai(`${svcLabel||office.svc||"就労継続支援B型"}「${office.name||"\u5F53\u4E8B\u696D\u6240"}」${fmtYM(ym)}施設外就労。${summary||"\u65BD\u8A2D\u5916\u5C31\u52B4\u306A\u3057"}、延べ${totalOut}日。今月の振り返りと来月への一言を70文字以内で。`);
    setAiPlan(txt||"");setBusy(false);
  };

  const dayReport=viewDay?buildDayReport(viewDay):null;

  return <div style={{padding:14}}>
    <Header title={"📆 利用日集計 ― "+fmtYM(ym)}>
      <GBtn onClick={dlCsv} color="#1B5E20">📥 CSV出力（施設外+通所）</GBtn>
      <GBtn onClick={genAI} busy={busy}>🤖 AIコメント</GBtn>
      <PrtBtn/>
    </Header>
    <div className="np" style={{display:"flex",gap:12,alignItems:"center",marginBottom:10}}>
      <MonthNav ym={ym} setYm={setYm}/>
      <div style={{background:"#E8F5E9",border:"1px solid #A5D6A7",borderRadius:5,padding:"5px 12px",fontSize:11,color:"#1B5E20"}}>
        施設外就労者：<b>{rows.filter(r=>r.outCount>0).length}名</b> ／ 延べ：<b>{totalOut}日</b>
      </div>
    </div>
    {aiPlan&&<div style={{background:"#E8F5E9",border:"1px solid #A5D6A7",borderRadius:5,padding:"7px 12px",marginBottom:8,fontSize:12,color:"#1B5E20"}}>💬 {aiPlan}</div>}

    {/* 利用日集計マトリクス（添付様式：施設外／施設内=通所+在宅／利用者数） */}
    <div style={{overflowX:"auto",marginBottom:14}}>
    <table style={{borderCollapse:"collapse",minWidth:900}}>
      <thead>
        <tr style={{background:"#F1F8E9"}}>
          <th style={{...gcell,minWidth:96,textAlign:"left",background:"#E8F5E9"}}>氏名</th>
          {days.map(d=>{const wd=new Date(y2,m2-1,d).getDay();return <th key={d} style={{...gcell,minWidth:22,color:wd===0?"#C62828":wd===6?"#1565C0":"#333"}}>{d}<br/>{WD2[wd]}</th>;})}
          <th style={{...gcell,minWidth:34,background:"#E3F2FD",color:"#1565C0"}}>外計</th>
          <th style={{...gcell,minWidth:34,background:"#E8F5E9",color:"#1B5E20"}}>内計</th>
        </tr>
      </thead>
      <tbody>
        {names.map(n=>{
          let outTot=0,inTot=0;
          const cells=days.map(d=>{const st=stOf(n,d);let lbl="",col="#333";
            if(st==="\u5916"){lbl="外";col="#1565C0";outTot++;}
            else if(st==="\u901A"){lbl="○";col="#1B5E20";inTot++;}
            else if(st==="\u5728"){lbl="在";col="#7B1FA2";inTot++;}
            return <td key={d} style={{...gcell,color:col,fontWeight:lbl?"bold":"normal"}}>{lbl}</td>;});
          return <tr key={n}><td style={{...gcell,textAlign:"left"}}>{n}</td>{cells}<td style={{...gcell,fontWeight:"bold",color:"#1565C0",background:"#E3F2FD"}}>{outTot||""}</td><td style={{...gcell,fontWeight:"bold",color:"#1B5E20",background:"#E8F5E9"}}>{inTot||""}</td></tr>;
        })}
      </tbody>
      <tfoot>
        <tr style={{background:"#E3F2FD",fontWeight:"bold"}}>
          <td style={{...gcell,textAlign:"left"}}>施設外</td>
          {outByDay.map((c,i)=><td key={i} style={{...gcell,color:"#1565C0"}}>{c||""}</td>)}
          <td style={{...gcell,color:"#1565C0"}}>{sumArr(outByDay)}</td>
          <td style={gcell}></td>

// 15. 出席状況タブ（開所日数選択・設定localStorage保存）
// ============================================================
function KaikinTab({names,allData,office}){
  const [ym,setYm]=useState(monthKey(new Date()));
  // localStorage から設定を復元（タブ切替後も保持）
  const KAIKIN_KEY=officeKey("kaikin_settings");
  const loadKaikinSettings=()=>{
    try{ return JSON.parse(localStorage.getItem(KAIKIN_KEY)||"{}"); }catch(e){ return {}; }
  };
  const [settings,setSettingsState]=useState(()=>loadKaikinSettings());
  const saveSettings=(key,val)=>{
    setSettingsState(prev=>{
      const next={...prev,[key]:val};
      try{localStorage.setItem(KAIKIN_KEY,JSON.stringify(next));}catch(e){}
      return next;
    });
  };
  const openKey=ym+"_open";
  const modeKey=ym+"_mode"; // "all"=平日全て, "count"=日数選択, "manual"=手動入力
  const countKey=ym+"_count";
  const openDaysInput=settings[openKey]||"";
  const inputMode=settings[modeKey]||"all";
  const setOpenDaysInput=v=>saveSettings(openKey,v);
  const setInputMode=v=>saveSettings(modeKey,v);
  const [y2,m2]=ym.split("-").map(Number);
  const nd=new Date(y2,m2,0).getDate();
  const allWeekdays=[];
  for(let d=1;d<=nd;d++){
    const wd=new Date(y2,m2-1,d).getDay();
    if(wd!==0&&wd!==6) allWeekdays.push(d);
  }
  const openCount2=settings[countKey]||allWeekdays.length;
  const setOpenCount2=v=>saveSettings(countKey,Number(v));
  const parseOpenDays=()=>{
    if(inputMode==="all") return allWeekdays;
    if(inputMode==="count") return allWeekdays.slice(0,Number(openCount2)||allWeekdays.length);
    if(!openDaysInput.trim()) return allWeekdays;
    return openDaysInput.split(/[,、\s]+/).map(Number).filter(d=>d>=1&&d<=nd);
  };
  const openDays=parseOpenDays();
  const openCount=openDays.length;

  const rows=names.map(n=>{
    const u=allData[n]||{};
    const md=(u.att||{})[ym]||{};
    let use=0,abs=0,kasan=0;
    openDays.forEach(d=>{
      const v=md[d]||{};
      if(v.st==="通"||v.st==="外") use++;
      else if(v.st==="欠") abs++;
      else if(v.st==="加") kasan++;
    });
    const rate=openCount>0?Math.round(use/openCount*100):0;
    return {n,use,abs,kasan,rate,jukyu:u.jukyu||""};
  }).filter(r=>r.use>0||r.abs>0||r.kasan>0);

  const dlCsv=()=>{
    const esc=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const lines=[["氏名","受給者証番号","利用日数","欠席","欠席加算","出席率(%)"].map(esc).join(",")]
      .concat(rows.slice().sort((a,b)=>b.rate-a.rate).map(r=>[r.n,r.jukyu,r.use,r.abs,r.kasan,r.rate].map(esc).join(",")));
    const blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="出席状況_"+ym+".csv";a.click();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
  };

  return <div style={{padding:14}}>
    <Header title={"📊 出席状況 ― "+fmtYM(ym)}>
      <GBtn onClick={dlCsv} disabled={rows.length===0} color="#1B5E20">📥 CSV出力</GBtn>
      <PrtBtn/>
    </Header>
    <div className="np" style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:8}}>
      <MonthNav ym={ym} setYm={setYm}/>
    </div>
    {/* 開所日設定（localStorage保存で他タブ移動後も保持） */}
    <div style={{background:"#E8F5E9",border:"1px solid #A5D6A7",borderRadius:6,padding:10,marginBottom:10}}>
      <div style={{fontSize:12,fontWeight:"bold",color:"#1B5E20",marginBottom:8}}>📅 開所日の設定（自動保存・出席率の分母になります）</div>
      <div style={{display:"flex",gap:8,marginBottom:6}}>
        {[["all","平日全て（デフォルト）"],["count","開所日数を選択"],["manual","日付を手動入力"]].map(([v,lbl])=>(
          <label key={v} style={{fontSize:11,display:"flex",alignItems:"center",gap:3,cursor:"pointer",
            background:inputMode===v?"#1B5E20":"#fff",color:inputMode===v?"#fff":"#333",
            border:"1px solid "+(inputMode===v?"#1B5E20":"#A5D6A7"),borderRadius:4,padding:"3px 8px"}}>
            <input type="radio" value={v} checked={inputMode===v} onChange={()=>setInputMode(v)}
              style={{display:"none"}}/>
            {lbl}
          </label>
        ))}
      </div>
      {inputMode==="all"&&<div style={{fontSize:11,color:"#555",padding:"4px 8px",background:"#fff",borderRadius:4,border:"1px solid #C8E6C9",display:"inline-block"}}>
        📌 {fmtYM(ym)}の平日: <b style={{color:"#1B5E20"}}>{allWeekdays.length}日</b>（{allWeekdays[0]}日〜{allWeekdays[allWeekdays.length-1]}日）
      </div>}
      {inputMode==="count"&&<div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:11,color:"#555"}}>開所日数：</span>
        <select value={openCount2} onChange={e=>setOpenCount2(e.target.value)}
          style={{padding:"4px 8px",fontSize:12,border:"1px solid #A5D6A7",borderRadius:4,fontWeight:"bold"}}>
          {Array.from({length:allWeekdays.length},(_,i)=>i+1).map(n=>(
            <option key={n} value={n}>{n}日</option>
          ))}
        </select>
        <span style={{fontSize:11,color:"#555"}}>（平日の先頭から）</span>
      </div>}
      {inputMode==="manual"&&<div>
        <div style={{fontSize:10,color:"#888",marginBottom:2}}>日付をスペース・カンマ区切りで入力</div>
        <input value={openDaysInput} onChange={e=>setOpenDaysInput(e.target.value)}
          placeholder={"例: 1 2 3 6 7 8 9 10"}
          style={{width:"100%",maxWidth:400,padding:"5px 8px",fontSize:11,border:"1px solid #A5D6A7",borderRadius:4}}/>
      </div>}
      <div style={{marginTop:5,fontSize:11,color:"#1B5E20",fontWeight:"bold"}}>
        → 開所日数: <span style={{fontSize:14}}>{openCount}</span>日
        <span style={{fontSize:10,color:"#888",marginLeft:8,fontWeight:"normal"}}>（設定は自動保存されます）</span>
      </div>
    </div>

    <table style={{width:"100%",borderCollapse:"collapse"}}>
      <thead><tr>
        <th style={th}>氏名</th>
        <th style={{...th,width:"12%"}}>利用日数</th>
        <th style={{...th,width:"9%"}}>欠席</th>
        <th style={{...th,width:"9%"}}>欠席加算</th>
        <th style={{...th,width:"22%"}}>出席率</th>
      </tr></thead>
      <tbody>
        {rows.length===0&&<tr><td colSpan={5} style={{...td,textAlign:"center",color:"#999",padding:14}}>この月の実績がありません</td></tr>}
        {rows.slice().sort((a,b)=>b.rate-a.rate).map(r=><tr key={r.n}>
          <td style={td}>{r.n}</td>
          <td style={{...td,textAlign:"center",fontWeight:"bold"}}>{r.use}日</td>
          <td style={{...td,textAlign:"center",color:r.abs>0?"#C62828":"#aaa"}}>{r.abs>0?r.abs+"日":"－"}</td>
          <td style={{...td,textAlign:"center",color:r.kasan>0?"#E65100":"#aaa"}}>{r.kasan>0?r.kasan+"回":"－"}</td>
          <td style={{...td,textAlign:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:4}}>
              <div style={{flex:1,height:8,background:"#eee",borderRadius:4,overflow:"hidden"}}>
                <div style={{height:"100%",width:Math.min(100,r.rate)+"%",
                  background:r.rate>=90?"#388E3C":"#78909C",borderRadius:4}}/>
              </div>
              <span style={{fontSize:11,fontWeight:"bold",minWidth:35,
                color:r.rate>=90?"#1B5E20":"#555"}}>{r.rate}%</span>
            </div>
          </td>
        </tr>)}
      </tbody>
    </table>
    <div style={{marginTop:8,fontSize:10,color:"#888"}}>
      ※ 出席率＝出席日数（通所・施設外）÷ 開所日数。開所日は上の設定欄で調整できます。
    </div>
  </div>;
}

    const cityNo6=cityNo.padStart(6,"0");

    const REC01_LEN=174, REC02_LEN=115; // 1行の総項目数（先頭の 2,通番 を含む）
    const ST={"通":"1","外":"1","欠":"3","加":"3"};  // 施設外就労(外)は通所(出席)として扱う
    const fmtT=t=>{const d=String(t||"").replace(/[^0-9]/g,"");return d?d.padStart(4,"0"):"";};

    const memoSafe=(m,stChar)=>{
      if(stChar!=="欠"&&stChar!=="加") return "";
      let z=String(m||"").replace(/[\r\n",]/g," ").trim();
      if(!z) return "";
      if(typeof Encoding!=="undefined"&&Encoding.toZenkakuCase){ z=Encoding.toZenkakuCase(Encoding.toZenkanaCase(z)); }
      z=z.replace(/ /g,"　").replace(/[\x00-\x7F]/g,"");
      return z.slice(0,20);
    };
    const nd=new Date(y2,m2,0).getDate();
    let dataRecs=[]; let recSeq=2; let targetCount=0;
    const warnings=[]; // 国保電子提出前チェック：おかしい記載を見つけたらここに積む

    };
    const pushRec=f=>{
      f[f.length-1]="0"; // 最終項目(未使用の加算欄)に明示的な0を置き、Excelの空欄削除で項目数が変わるのを防ぐ
      dataRecs.push(f[0]+","+recSeq+","+f.slice(2).map(esc).join(","));recSeq++;
    };
    names.forEach(name=>{
      const u=allData[name]||{};
      const jukyuRaw=(u.jukyu||"").trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
      if(!jukyuRaw)return;
      if(!/^[0-9]+$/.test(jukyuRaw)||jukyuRaw.length>10){
        warnings.push(name+"さん: 受給者証番号「"+jukyuRaw+"」の桁数・文字に誤りがある可能性があります");
      }
      const jukyu=jukyuRaw.padStart(10,"0");
      const md=((u.att||{})[ym])||{};
      const days=[];
      for(let d=1;d<=nd;d++){
        const v=md[d];
        if(!v||!v.st)continue;
        const st=ST[v.st];
        if(!st)continue;
        days.push({d,v,st});
      }
      if(days.length===0)return;
      targetCount++;
      const useDays=days.filter(e=>e.st!=="3").length;

          const WD2=["日","月","火","水","木","金","土"];
          const ST2={"通":"通所","外":"施設外就労","欠":"欠席","加":"欠席対応","在":"在宅","":"―"};
          const c=calcMonth(md);
          return (
            <div key={name} style={{marginBottom:18,border:"2px solid #1565C0",borderRadius:6,overflow:"hidden"}}>
              <div style={{background:"#1565C0",color:"#fff",padding:"6px 14px",fontSize:12,fontWeight:"bold"}}>
                就労継続支援提供実績記録票　{name}　受給者証番号：{jukyu||"（未入力）"}　{reiwaYM(ym)}分
              </div>
              <div style={{padding:"5px 10px",background:"#E3F2FD",fontSize:11,display:"flex",gap:20,flexWrap:"wrap",borderBottom:"1px solid #90CAF9"}}>
                <span>事業所：{(office&&office.name)||""}</span>
                <span>利用日数：{c.use}日　施設外：{c.out}日　欠席対応：{c.kasan}回</span>
                <span>送迎往：{c.s1}回　送迎復：{c.s2}回　食事：{c.meal}回</span>
              </div>
              <div style={{overflowX:"auto"}}>
                <table style={{borderCollapse:"collapse",fontSize:10,minWidth:640}}>
                  <thead>
                    <tr style={{background:"#BBDEFB"}}>
                      {["日付","提供状況","開始時間","終了時間","送往","送復","食事","備考"].map((h,i)=>(
                        <th key={i} style={{border:"1px solid #90CAF9",padding:"3px 5px",textAlign:"center",minWidth:i===0?55:i===1?70:i===2||i===3?50:i===7?110:32}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {Array.from({length:nd},(_,i)=>i+1).map(d=>{
                      const v=md[d]||{};
                      const dt=new Date(y2,m2-1,d);
                      const wd=dt.getDay();
                      const bg=wd===0?"#FFEBEE":wd===6?"#E3F2FD":v.st?"#fff":"#F5F5F5";
                      return (
                        <tr key={d} style={{background:bg}}>
                          <td style={{border:"1px solid #BBDEFB",padding:"2px 5px",textAlign:"center",color:wd===0?"#C62828":wd===6?"#1565C0":"inherit"}}>{m2}/{d}（{WD2[wd]}）</td>
                          <td style={{border:"1px solid #BBDEFB",padding:"2px 5px",textAlign:"center",fontWeight:v.st?"bold":"normal",color:v.st==="通"?"#1B5E20":v.st==="欠"||v.st==="加"?"#E65100":v.st==="外"?"#1565C0":"#999"}}>{ST2[v.st||""]||"―"}</td>
                          <td style={{border:"1px solid #BBDEFB",padding:"2px 5px",textAlign:"center"}}>{v.in||""}</td>
                          <td style={{border:"1px solid #BBDEFB",padding:"2px 5px",textAlign:"center"}}>{v.out||""}</td>
                          <td style={{border:"1px solid #BBDEFB",padding:"2px",textAlign:"center",background:v.s1?"#FFF9C4":""}}>{v.s1?"往":""}</td>
                          <td style={{border:"1px solid #BBDEFB",padding:"2px",textAlign:"center",background:v.s2?"#FFF9C4":""}}>{v.s2?"復":""}</td>
                          <td style={{border:"1px solid #BBDEFB",padding:"2px",textAlign:"center",background:v.meal?"#E8F5E9":""}}>{v.meal?"✓":""}</td>
                          <td style={{border:"1px solid #BBDEFB",padding:"2px 5px",fontSize:10,color:"#555"}}>{v.memo||""}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          );
        })}
      </div>}

      <div style={{marginTop:10,fontSize:10,color:"#888",lineHeight:1.8}}>
        ※ 算定要件（加算の届出・体制要件等）は最新の報酬告示・自治体の指導に従いご確認ください。<br/>
        ※ 受給者証番号は「実績記録タブ」、事業所番号は「🏢事業所設定」で入力できます。
      </div>
    </div>
  );
}

function CheckGroup({label,options,value,onChange}){
  const v=value||[];
  const toggle=(opt)=>onChange(v.includes(opt)?v.filter(x=>x!==opt):[...v,opt]);
  return <div style={{marginBottom:10}}>
    <div style={{fontSize:11,fontWeight:"bold",color:G,marginBottom:4}}>{label}</div>
    <div className="screen-only" style={{display:"flex",flexWrap:"wrap",gap:8}}>
      {options.map(opt=>(
        <label key={opt} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,background:v.includes(opt)?GP:"#f5f5f5",padding:"4px 8px",borderRadius:4,border:"1px solid "+(v.includes(opt)?GM:"#ddd"),cursor:"pointer"}}>
          <input type="checkbox" checked={v.includes(opt)} onChange={()=>toggle(opt)}/>{opt}
        </label>
      ))}
    </div>
    <div className="print-only" style={{fontSize:11}}>{v.length?v.join("、"):"\u3000"}</div>
  </div>;
}
function RadioGroup({label,options,value,onChange}){
  return <div style={{marginBottom:10}}>
    <div style={{fontSize:11,fontWeight:"bold",color:G,marginBottom:4}}>{label}</div>
    <div className="screen-only" style={{display:"flex",flexWrap:"wrap",gap:8}}>
      {options.map(opt=>(
        <label key={opt} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,background:value===opt?GP:"#f5f5f5",padding:"4px 8px",borderRadius:4,border:"1px solid "+(value===opt?GM:"#ddd"),cursor:"pointer"}}>
          <input type="radio" checked={value===opt} onChange={()=>onChange(opt)}/>{opt}
        </label>
      ))}
    </div>
    <div className="print-only" style={{fontSize:11}}>{value||"\u3000"}</div>
  </div>;
}
function TF({label,value,onChange,placeholder}){
  return <div style={{marginBottom:10}}>
    <div style={{fontSize:11,fontWeight:"bold",color:G,marginBottom:3}}>{label}</div>
    <input value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder||""} className="screen-only"
      style={{width:"100%",padding:"6px 8px",fontSize:12,border:"1px solid #C8E6C9",borderRadius:4,boxSizing:"border-box"}}/>
    <div className="print-only" style={{fontSize:11}}>{value||"\u3000"}</div>
  </div>;
}

        <div style={{fontSize:11,fontWeight:"bold",color:G,marginBottom:3,marginTop:6}}>その他備考</div>

// ===== 職員の管理（管理者のみ） v7.35 =====
function StaffManager({staffList,setStaffList,me,onClose}){
  const [name,setName]=useState(""); const [pin,setPin]=useState(""); const [role,setRole]=useState("staff");
  const [err,setErr]=useState(""); const [msg,setMsg]=useState(""); const [busy,setBusy]=useState(false);

  const reload=async()=>{ try{ const r=await api("/load",{}); setStaffList(r.staff||[]); }catch(e){} };

  const add=async()=>{
    if(!name.trim()){setErr("お名前を入力してください");return;}
    if(!/^\d{4,6}$/.test(pin)){setErr("PINは4〜6桁の数字で入力してください");return;}
    setErr("");setMsg("");setBusy(true);
    try{
      await api("/staff/add",{name:name.trim(),pin,role});
      await reload();
      setMsg(name.trim()+" さんを追加しました");
      setName("");setPin("");setRole("staff");
    }catch(e){ setErr(e.message); }
    setBusy(false);
  };

  const remove=async(s)=>{
    if(!window.confirm(s.name+" さんを削除しますか？\n※ログインできなくなります。これまでの記録は残ります。"))return;
    setErr("");setMsg("");setBusy(true);
    try{ await api("/staff/remove",{staffId:s.id}); await reload(); setMsg(s.name+" さんを削除しました"); }
    catch(e){ setErr(e.message); }
    setBusy(false);
  };

  const resetPin=async(s)=>{
    const p=window.prompt(s.name+" さんの新しいPIN（4〜6桁の数字）");
    if(!p)return;
    if(!/^\d{4,6}$/.test(p)){alert("PINは4〜6桁の数字で入力してください");return;}
    setErr("");setMsg("");setBusy(true);
    try{ await api("/staff/pin",{staffId:s.id,pin:p}); setMsg(s.name+" さんのPINを変更しました"); }
    catch(e){ setErr(e.message); }
    setBusy(false);
  };

  return <div className="np" style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:16}}>
    <div style={{width:"100%",maxWidth:520,maxHeight:"88vh",overflowY:"auto",background:"#fff",borderRadius:12,boxShadow:"0 10px 40px rgba(0,0,0,.3)"}}>
      <div style={{background:"#0277BD",color:"#fff",padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:16,fontWeight:"bold"}}>👥 職員の管理</div>
        <button onClick={onClose} style={{background:"none",border:"none",color:"#fff",fontSize:22,cursor:"pointer",lineHeight:1}}>×</button>
      </div>
      <div style={{padding:18,display:"flex",flexDirection:"column",gap:14}}>
        {err&&<div style={{background:"#FFEBEE",border:"1px solid #EF9A9A",borderRadius:5,padding:"8px 11px",fontSize:12,color:"#C62828"}}>{err}</div>}
        {msg&&<div style={{background:"#E8F5E9",border:"1px solid #A5D6A7",borderRadius:5,padding:"8px 11px",fontSize:12,color:"#1B5E20"}}>{msg}</div>}

        <div>
          <div style={{fontSize:12.5,fontWeight:"bold",color:"#0277BD",marginBottom:7}}>登録されている職員（{staffList.length}名）</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {staffList.map(s=><div key={s.id} style={{display:"flex",alignItems:"center",gap:8,border:"1px solid #E0E0E0",borderRadius:6,padding:"8px 10px"}}>
              <div style={{flex:1,fontSize:13.5,fontWeight:"bold",color:"#333"}}>
                {s.name}
                {s.role==="admin"&&<span style={{fontSize:9.5,marginLeft:6,background:"#FFF3E0",color:"#E65100",border:"1px solid #FFCC80",borderRadius:3,padding:"1px 5px"}}>管理者</span>}
                {me&&s.id===me.staffId&&<span style={{fontSize:9.5,marginLeft:5,color:"#888"}}>（あなた）</span>}
              </div>
              <button onClick={()=>resetPin(s)} disabled={busy} style={{padding:"4px 9px",fontSize:10.5,background:"#E1F5FE",color:"#01579B",border:"1px solid #B3E5FC",borderRadius:4,cursor:"pointer"}}>PIN変更</button>
              {me&&s.id!==me.staffId&&<button onClick={()=>remove(s)} disabled={busy} style={{padding:"4px 9px",fontSize:10.5,background:"#FFEBEE",color:"#C62828",border:"1px solid #EF9A9A",borderRadius:4,cursor:"pointer"}}>削除</button>}
            </div>)}
          </div>
        </div>

        <div style={{borderTop:"1px solid #E0E0E0",paddingTop:14}}>
          <div style={{fontSize:12.5,fontWeight:"bold",color:"#0277BD",marginBottom:8}}>＋ 職員を追加する</div>
          <div style={{display:"flex",flexDirection:"column",gap:9}}>
            <div>
              <div style={{fontSize:11,color:"#666",marginBottom:3}}>お名前</div>
              <input value={name} onChange={e=>setName(e.target.value)} placeholder={"例：田中 花子"}
                style={{width:"100%",padding:"9px 11px",fontSize:13.5,border:"1px solid #B3E5FC",borderRadius:5,boxSizing:"border-box"}}/>
            </div>
            <div>
              <div style={{fontSize:11,color:"#666",marginBottom:3}}>PIN（4桁の数字）</div>
              <input value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,"").slice(0,6))} inputMode="numeric" placeholder={"1234"}
                style={{width:"100%",padding:"9px 11px",fontSize:15,border:"1px solid #B3E5FC",borderRadius:5,letterSpacing:4,textAlign:"center",boxSizing:"border-box"}}/>
              <div style={{fontSize:10,color:"#888",marginTop:3}}>本人に伝えてください。あとから変更できます。</div>
            </div>
            <div>
              <div style={{fontSize:11,color:"#666",marginBottom:3}}>権限</div>
              <select value={role} onChange={e=>setRole(e.target.value)}
                style={{width:"100%",padding:"9px 11px",fontSize:13,border:"1px solid #B3E5FC",borderRadius:5,boxSizing:"border-box"}}>
                <option value="staff">一般職員（記録の入力）</option>
                <option value="admin">管理者（職員の追加・削除もできる）</option>
              </select>
            </div>
            <button onClick={add} disabled={busy}
              style={{padding:"11px 0",fontSize:14,fontWeight:"bold",background:"#0277BD",color:"#fff",border:"none",borderRadius:7,cursor:"pointer",opacity:busy?.6:1}}>
              {busy?"処理中…":"この内容で追加する"}
            </button>
          </div>
        </div>

        <div style={{background:"#F5F5F5",borderRadius:6,padding:"10px 12px",fontSize:11,color:"#666",lineHeight:1.8}}>
          職員が退職したら「削除」を押してください。その職員はログインできなくなりますが、<b>これまでに書いた記録は残ります</b>。
        </div>
      </div>
    </div>
  </div>;
}

      });

  const tapPad=(d)=>{
    if(busy) return;
    if(d==="del"){ setPin(p=>p.slice(0,-1)); return; }

      <button onClick={submitLicense} disabled={busy} style={{...BTN,opacity:busy?.6:1}}>{busy?"確認中…":"次へ"}</button>
      <div style={{fontSize:10,color:"#888",textAlign:"center",lineHeight:1.6}}>Copyright © Hideki Saitou / 合同会社Anna</div>
    </div>
  </div></div>;

  // --- 1.5 初回：管理者を1名つくる ---
  if(step==="bootstrap") return <div style={LOGIN_WRAP}><div style={LOGIN_BOX}>
    <Head sub="初期設定（管理者の登録）"/>
    <div style={LOGIN_BODY}>
      <div style={{background:"#E8F5E9",border:"1px solid #A5D6A7",borderRadius:6,padding:"10px 12px",fontSize:12,lineHeight:1.7,color:"#1B5E20"}}>

      </div>
      <div>
        <div style={{fontSize:12,fontWeight:"bold",color:"#1B5E20",marginBottom:5}}>PIN（4桁の数字）</div>
        <input value={bPin} onChange={e=>setBPin(e.target.value.replace(/\D/g,"").slice(0,6))} type="password" inputMode="numeric"

      </div>
      <div>

        style={{background:"none",border:"none",color:"#888",fontSize:11,cursor:"pointer",textDecoration:"underline"}}>事業所コードを入力しなおす</button>
    </div>
  </div></div>;

  // --- 2. 職員をえらぶ ---
  if(step==="staff") return <div style={LOGIN_WRAP}><div style={LOGIN_BOX}>
    <Head sub={fac?fac.facilityName:""}/>

    </div>

  // --- 3. PIN ---
  const PAD=["1","2","3","4","5","6","7","8","9","","0","del"];
  return <div style={LOGIN_WRAP}><div style={LOGIN_BOX}>
    <Head sub={who?who.name:""}/>
    <div style={LOGIN_BODY}>
      <div style={{fontSize:14,fontWeight:"bold",color:"#1B5E20",textAlign:"center"}}>PINを入力してください</div>
      {err&&<div style={ERRBOX}>{err}</div>}

          background:pin.length>i?"#388E3C":"#fff",border:"2px solid #388E3C"}}/>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:9}}>
        {PAD.map((d,i)=>d===""

              style={{padding:"16px 0",fontSize:d==="del"?15:21,fontWeight:"bold",
                background:d==="del"?"#F5F5F5":"#fff",border:"1px solid #C8E6C9",borderRadius:9,
                cursor:"pointer",color:d==="del"?"#666":"#1B5E20"}}>{d==="del"?"⌫":d}</button>
        )}
      </div>
      <button onClick={()=>submitPin()} disabled={busy||pin.length<4} style={{...BTN,opacity:(busy||pin.length<4)?.5:1}}>
        {busy?"確認中…":"ログイン"}
      </button>
      <button onClick={()=>{setStep("staff");setPin("");setErr("");}}
        style={{background:"none",border:"none",color:"#888",fontSize:12,cursor:"pointer",textDecoration:"underline"}}>← 名前をえらびなおす</button>
    </div>
  </div></div>;
}

  const [syncErr,setSyncErr] = useState("");
  const [livePresence,setLivePresence] = useState([]); // v7.41: Realtimeで瞬時に取得する「いま使用中の職員」名
  const [rtOn,setRtOn] = useState(false);              // v7.41: Realtime接続中フラグ
  const [rtStatus,setRtStatus] = useState("-");        // v7.48: 接続ステータス（診断）
  const [rtTrack,setRtTrack] = useState("-");          // v7.48: track結果（診断）

  // DBには触れず、在席情報（職員名）だけをWebSocketで即時にやり取りする。
  // 接続できない環境では rtOn=false のまま従来の数秒ポーリング表示にフォールバックする。
  useEffect(()=>{
    if(!cloudLoaded || !window.SESSION.token) return;
    if(!window.supabase || typeof window.supabase.createClient!=="function" || !SUPA_URL) return;
    // v7.49: Presence(在席)は track:ok でも状態が返らない不具合のため、Broadcast(放送)方式に変更。
    //        各PCが自分の名前を数秒ごとに放送し合い、受け取った名前を一覧表示する（自作の在席共有）。
    let client=null, ch=null, pingIv=null, refreshIv=null;
    const seen = {}; // 名前 -> 最後に受信した時刻(ms)
    const refresh = ()=>{
      const now = Date.now();
      const names = Object.keys(seen).filter(n=> now - seen[n] < 12000);
      setLivePresence(names);
    };
    try{
      client = window.supabase.createClient(SUPA_URL, SUPA_KEY);
      const room = "anna-bcast-" + (window.SESSION.facilityId || "default");
      const me = window.SESSION.staffName || "職員";
      ch = client.channel(room);
      ch.on("broadcast",{event:"here"},(msg)=>{
          const nm = msg && msg.payload && msg.payload.name;
          if(nm){ seen[nm] = Date.now(); setRtTrack("recv"); refresh(); }
        })
        .subscribe((status,err)=>{
          setRtStatus(String(status)+(err?(":"+(err.message||err)):""));
          if(status==="SUBSCRIBED"){
            setRtOn(true);
            seen[me] = Date.now(); refresh();
            const ping = ()=>{
              try{ ch.send({type:"broadcast",event:"here",payload:{name: me}}); }catch(e){}
              seen[me] = Date.now(); refresh();
            };
            ping();
            pingIv = setInterval(ping, 3000);
            refreshIv = setInterval(refresh, 3000);
          }
        });
    }catch(e){ setRtOn(false); setRtStatus("client_err:"+(e&&e.message||e)); }
    return ()=>{ try{clearInterval(pingIv);}catch(e){} try{clearInterval(refreshIv);}catch(e){} try{ if(client&&ch) client.removeChannel(ch); }catch(e){} setRtOn(false); };

        localStorage.setItem(officeKey("names"),JSON.stringify(names));
        localStorage.setItem(officeKey("office"),JSON.stringify(office));
      }catch(e){}
      setSavedAt(new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}));

      // 読込前・未ログインならクラウド保存しない（空データでの上書き防止）
      if(!cloudLoaded || !window.SESSION.token) return;

      // 変更のあったものだけ集める（他の職員のデータを巻き込まない）
      const pend=[];
      const add=(userName,dataType,content,raw)=>{
        const k=userName+"|"+dataType, s=JSON.stringify(raw!==undefined?raw:content);
        if(lastSentRef.current[k]===s) return;
        pend.push({userName,dataType,content,base:stampsRef.current[k]||null,_k:k,_s:s});
      };
      Object.entries(allData).forEach(([u,d])=>add(u,"plan",d));
      Object.entries(allAssess).forEach(([u,d])=>add(u,"assess",d));
      add("__system__","names",{names},names);
      add("__system__","office",office,office);

        // v7.53: Cloudflare Workerの1回あたりの処理上限（サブリクエスト50件）を超えないよう15件ずつ分割送信
        const allConflicts=[];

          const res=await api("/save",{changes:part.map(c=>({userName:c.userName,dataType:c.dataType,content:c.content,base:c.base}))});
          (res.saved||[]).forEach(sv=>{
            const k=sv.userName+"|"+sv.dataType;
            stampsRef.current[k]=sv.updatedAt;
            const c=part.find(x=>x._k===k); if(c) lastSentRef.current[k]=c._s;
          });
          if(res.conflicts && res.conflicts.length) allConflicts.push(...res.conflicts);
        }
        if(allConflicts.length) setConflicts(allConflicts);
        setSyncErr("");
        setCloudAt(new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})); // v7.51: クラウド保存が成功した時刻
      }catch(e){ setSyncErr("クラウド保存に失敗しました（"+e.message+"）。サインや備考がこの端末以外に反映されていない可能性があります。"); }
    },1000);
    return ()=>clearTimeout(t);
  },[allData,allAssess,names,office,cloudLoaded]);

  const resolveConflict=(mine)=>{
    if(mine){

      conflicts.forEach(c=>{

        stampsRef.current[k]=c.serverUpdatedAt;
        delete lastSentRef.current[k];
      });
      setAllData(p=>({...p}));  // 再保存を促す
    }else{
      // 相手の内容に合わせる
      conflicts.forEach(c=>{
        const k=c.userName+"|"+c.dataType;
        stampsRef.current[k]=c.serverUpdatedAt;
        lastSentRef.current[k]=JSON.stringify(c.dataType==="names"?((c.serverContent&&c.serverContent.names)||[]):c.serverContent);

        else if(c.dataType==="assess") setAllAssess(p=>({...p,[c.userName]:c.serverContent}));
        else if(c.dataType==="names")  setNames((c.serverContent&&c.serverContent.names)||[]);
        else if(c.dataType==="office"){const o={...OFFICE_DEFAULT,...(c.serverContent||{})};setOffice(o);OFFICE=o;}
      });

      const openPlan=conflicts.find(c=>c.userName===sel&&c.dataType==="plan");
      if(sel && openPlan) hydrate(sel, {...allDataRef.current, [sel]: openPlan.serverContent});
    }

          <div style={{fontSize:11,fontWeight:"bold",color:"#C62828"}}>別の事業所として使い始める場合</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={clearOffice} style={{flex:1,padding:"7px 8px",fontSize:11,background:"#FFF3E0",color:"#E65100",border:"1px solid #FFB74D",borderRadius:4,cursor:"pointer"}}>事業所設定をクリア</button>
            <button onClick={resetAll} style={{flex:1,padding:"7px 8px",fontSize:11,fontWeight:"bold",background:"#FFEBEE",color:"#C62828",border:"1px solid #EF9A9A",borderRadius:4,cursor:"pointer"}}>⚠️ 全データ初期化</button>
          </div>
          <div style={{fontSize:10,color:"#888",lineHeight:1.6}}>「全データ初期化」は利用者名簿と入力データをすべて削除し、新しい事業所として最初から始めます（実行前に必ず控えの保存をおすすめします）。</div>
        </div>
        <div style={{display:"flex",justifyContent:"flex-end"}}>
          <button onClick={()=>setOfficeOpen(false)} style={{padding:"8px 20px",fontSize:12,fontWeight:"bold",background:GM,color:"#fff",border:"none",borderRadius:4,cursor:"pointer"}}>✅ 閉じる（保存済み）</button>
        </div>
      </div>
    </div>}
    {bulkOpen&&<div className="np" style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:10000,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>setBulkOpen(false)}>
      <div style={{background:"#fff",borderRadius:8,padding:18,width:420,maxWidth:"92vw",maxHeight:"86vh",display:"flex",flexDirection:"column",gap:10}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:14,fontWeight:"bold",color:G}}>📋 利用者名簿の一括入れ替え</div>
        <div style={{fontSize:11,color:"#666",lineHeight:1.7}}>
          1行に1名ずつ氏名を入力してください（現在の名簿が入っています）。<br/>
          Excelの氏名列をコピーしてそのまま貼り付けることもできます。<br/>
          <span style={{color:"#E65100"}}>※名簿から外れた方のデータは削除されず保管され、同じ氏名で再追加すると復元されます。</span>
        </div>
        <textarea value={bulkText} onChange={e=>setBulkText(e.target.value)} rows={15}
          style={{width:"100%",padding:"8px 10px",fontSize:12,border:"1px solid #C8E6C9",borderRadius:5,resize:"vertical",lineHeight:1.7,fontFamily:"Meiryo,sans-serif"}}/>
        <div style={{fontSize:10,color:"#888"}}>現在 {bulkText.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).length} 名</div>
        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button onClick={()=>setBulkOpen(false)} style={{padding:"7px 16px",fontSize:12,background:"#eee",border:"none",borderRadius:4,cursor:"pointer"}}>キャンセル</button>
          <button onClick={applyBulk} style={{padding:"7px 16px",fontSize:12,fontWeight:"bold",background:GM,color:"#fff",border:"none",borderRadius:4,cursor:"pointer"}}>この名簿に入れ替える</button>
        </div>
      </div>
    </div>}
  </div>;
}
// ===== PINロック画面（端末セキュリティ） =====
function LockGate({hasPin,onUnlocked}){
  const [pin,setPin]=useState("");
  const [pin2,setPin2]=useState("");
  const [hint,setHint]=useState("");
  const [err,setErr]=useState("");
  const [ack,setAck]=useState(false);
  const [busy,setBusy]=useState(false);
  const savedHint = hasPin ? (window.__sec.hint&&window.__sec.hint()) : "";
  const run=(fn)=>{ setBusy(true); setErr(""); setTimeout(()=>{ try{fn();}finally{setBusy(false);} },30); };
  const doSetup=()=>run(()=>{
    if(pin.length<4){setErr("パスコードは4桁以上にしてください");return;}
    if(pin!==pin2){setErr("確認用パスコードが一致しません");return;}
    if(!ack){setErr("バックアップ確認にチェックしてください");return;}
    window.__sec.setup(pin,hint); onUnlocked();
  });
  const doUnlock=()=>run(()=>{
    if(window.__sec.unlock(pin)){ onUnlocked(); }
    else { setErr("パスコードが違います"); setPin(""); }
  });
  const box={width:"100%",padding:"12px 14px",fontSize:18,letterSpacing:2,textAlign:"center",border:"2px solid #A5D6A7",borderRadius:8,marginBottom:10,boxSizing:"border-box"};
  const btn={width:"100%",padding:"13px 0",background:busy?"#9E9E9E":"#1B5E20",color:"#fff",border:"none",borderRadius:8,fontSize:16,fontWeight:"bold",cursor:busy?"wait":"pointer"};
  return <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#E8F5E9,#F1F8E9)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{width:"100%",maxWidth:400,background:"#fff",borderRadius:14,boxShadow:"0 8px 28px rgba(0,0,0,0.18)",overflow:"hidden",border:"2px solid #C8E6C9"}}>
      <div style={{background:"#1B5E20",color:"#fff",padding:"20px 24px",textAlign:"center"}}>
        <div style={{fontSize:22,marginBottom:2}}>🔒</div>
        <div style={{fontSize:16,fontWeight:"bold"}}>{hasPin?"ロック解除":"パスコードの設定"}</div>
        <div style={{fontSize:11,opacity:.85,marginTop:2}}>この端末の記録データを保護します</div>
      </div>
      <div style={{padding:"22px 26px"}}>
        {err&&<div style={{background:"#FFEBEE",border:"1px solid #EF9A9A",borderRadius:6,padding:"8px 10px",fontSize:12,color:"#C62828",marginBottom:10}}>{err}</div>}
        {!hasPin ? <>
          <div style={{background:"#FFFDE7",border:"1px solid #F9A825",borderRadius:6,padding:"10px 12px",fontSize:12,lineHeight:1.7,color:"#5D4037",marginBottom:12}}>
            <b>⚠️ 重要</b><br/>
            設定したパスコードで<b>保存データを暗号化</b>します。<br/>
            <b>パスコードを忘れると、暗号化された記録は復元できません。</b><br/>
            設定前に「バックアップ（JSON書き出し）」で控えを取り、パスコードは安全に保管してください。
          </div>
          <input type="password" inputMode="numeric" value={pin} onChange={e=>setPin(e.target.value)} placeholder={"新しいパスコード（4桁以上）"} style={box}/>
          <input type="password" inputMode="numeric" value={pin2} onChange={e=>setPin2(e.target.value)} placeholder={"もう一度入力"} style={box}/>
          <input type="text" value={hint} onChange={e=>setHint(e.target.value)} placeholder={"ヒント（任意・パスコードそのものは書かない）"} style={{...box,fontSize:13,letterSpacing:0}}/>
          <label style={{display:"flex",alignItems:"flex-start",gap:8,fontSize:12,color:"#444",marginBottom:12,cursor:"pointer"}}>
            <input type="checkbox" checked={ack} onChange={e=>setAck(e.target.checked)} style={{marginTop:2}}/>
            <span>バックアップを取り、パスコードを忘れないことを確認しました</span>
          </label>
          <button onClick={doSetup} disabled={busy} style={btn}>{busy?"設定中…":"🔐 設定して始める"}</button>
        </> : <>
          <input type="password" inputMode="numeric" value={pin} autoFocus onChange={e=>setPin(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter")doUnlock();}} placeholder={"パスコード"} style={box}/>
          {savedHint&&<div style={{fontSize:11,color:"#888",marginBottom:10}}>ヒント：{savedHint}</div>}
          <button onClick={doUnlock} disabled={busy} style={btn}>{busy?"確認中…":"🔓 解除する"}</button>
        </>}
      </div>
    </div>
  </div>;
}

function AppRoot(){
  const [unlocked,setUnlocked]=useState(false);
  const [hasPin,setHasPin]=useState(()=>window.__sec.hasPin());
  // 自動ロック（15分無操作）
  useEffect(()=>{
    if(!unlocked) return;
    let t;
    const reset=()=>{ clearTimeout(t); t=setTimeout(()=>{ window.__sec.lock(); setUnlocked(false); }, 15*60*1000); };
    const evs=["mousedown","keydown","touchstart","mousemove","wheel"];
    evs.forEach(e=>window.addEventListener(e,reset,{passive:true}));
    reset();
    return ()=>{ clearTimeout(t); evs.forEach(e=>window.removeEventListener(e,reset)); };
  },[unlocked]);
  const handleUnlocked=()=>{
    // 解錠後、暗号化された事業所設定を読み直してグローバルを最新化する
    // （officeKey が使う _currentOfficeId・OFFICE はロック中に空で初期化されているため）
    try{ updateOfficeId(getCurrentOfficeId()); }catch(e){}
    try{ OFFICE={...OFFICE_DEFAULT,...(JSON.parse(localStorage.getItem(officeKey("office"))||"{}"))}; }catch(e){}
    setHasPin(true); setUnlocked(true);
  };
  if(!unlocked) return <LockGate hasPin={hasPin} onUnlocked={handleUnlocked}/>;
  return <>
    <button onClick={()=>{ window.__sec.lock(); setUnlocked(false); }}
      title="今すぐロック"
      style={{position:"fixed",top:6,right:6,zIndex:99999,background:"#1B5E20",color:"#fff",border:"none",borderRadius:6,padding:"5px 10px",fontSize:11,fontWeight:"bold",cursor:"pointer",opacity:.85}}>🔒 ロック</button>
    <AppMain/>
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppRoot/>);
</script>
